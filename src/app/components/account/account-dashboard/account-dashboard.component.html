<div class="container-fluid d-flex flex-column align-items-center mt-4">
  <div class="card basic-data-table w-100 border-0 shadow-sm">
    <div class="card-header card-form-header text-white text-center d-flex justify-content-between align-items-center">
      <label class="text-center text-md fw-medium ms-3">
        <i class="bi bi-calculator"></i>
        Account Dashboard
      </label>
    </div>

    <div *ngIf="!isLoading()" class="card-body p-4">
      <div class="row g-4">
        <!-- PI Pending Card -->
        <div class="col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm cursor-pointer" 
               (click)="navigateToCaseList('pi-pending')"
               style="transition: transform 0.2s; cursor: pointer;">
            <div class="card-body text-center">
              <div class="mb-3">
                <i class="bi bi-file-earmark-text text-warning" style="font-size: 3rem;"></i>
              </div>
              <h5 class="card-title text-muted mb-2">PI Pending</h5>
              <h2 class="text-warning mb-0">{{ dashboardData.piPending }}</h2>
            </div>
          </div>
        </div>

        <!-- Invoice Pending Card -->
        <div class="col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm cursor-pointer" 
               (click)="navigateToCaseList('invoice-pending')"
               style="transition: transform 0.2s; cursor: pointer;">
            <div class="card-body text-center">
              <div class="mb-3">
                <i class="bi bi-receipt text-info" style="font-size: 3rem;"></i>
              </div>
              <h5 class="card-title text-muted mb-2">Invoice Pending</h5>
              <h2 class="text-info mb-0">{{ dashboardData.invoicePending }}</h2>
            </div>
          </div>
        </div>

        <!-- Payment Pending Card -->
        <div class="col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm cursor-pointer" 
               (click)="navigateToCaseList('payment-pending')"
               style="transition: transform 0.2s; cursor: pointer;">
            <div class="card-body text-center">
              <div class="mb-3">
                <i class="bi bi-credit-card text-danger" style="font-size: 3rem;"></i>
              </div>
              <h5 class="card-title text-muted mb-2">Payment Pending</h5>
              <h2 class="text-danger mb-0">{{ dashboardData.paymentPending }}</h2>
            </div>
          </div>
        </div>

        <!-- Fully Settled Card -->
        <div class="col-md-6 col-lg-3">
          <div class="card h-100 border-0 shadow-sm cursor-pointer" 
               (click)="navigateToCaseList('fully-settled')"
               style="transition: transform 0.2s; cursor: pointer;">
            <div class="card-body text-center">
              <div class="mb-3">
                <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
              </div>
              <h5 class="card-title text-muted mb-2">Fully Settled</h5>
              <h2 class="text-success mb-0">{{ dashboardData.fullySettled }}</h2>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="card-body text-center py-5">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>
</div>
