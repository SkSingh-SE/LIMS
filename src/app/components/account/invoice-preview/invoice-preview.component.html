<div class="container-fluid d-flex flex-column align-items-center">
  <div class="card basic-data-table w-100 border-0 shadow-sm">
    <div class="card-header card-form-header text-white text-center d-flex justify-content-between align-items-center">
      <label class="text-center text-md fw-medium ms-3">
        <i class="bi bi-receipt"></i>
        Invoice Preview
      </label>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-light me-2" (click)="printInvoice()">
          <i class="bi bi-printer"></i> Print
        </button>
        <button class="btn btn-outline-light" (click)="goBack()">
          <i class="bi bi-arrow-left"></i> Back
        </button>
      </div>
    </div>

    <div *ngIf="!isLoading()" class="card-body">
      <div class="alert alert-info">
        <i class="bi bi-info-circle me-2"></i>
        Invoice preview functionality. In a production system, this would display the actual invoice PDF or formatted invoice.
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <button
          class="btn btn-success btn-lg"
          (click)="sendInvoice('email')"
          [disabled]="isSendingInvoice()"
        >
          <span *ngIf="isSendingInvoice()" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!isSendingInvoice()" class="bi bi-envelope me-2"></i>
          {{ isSendingInvoice() ? 'Sending...' : 'Send Email' }}
        </button>
        <button
          class="btn btn-success btn-lg"
          (click)="sendInvoice('whatsapp')"
          [disabled]="isSendingInvoice()"
        >
          <span *ngIf="isSendingInvoice()" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!isSendingInvoice()" class="bi bi-whatsapp me-2"></i>
          {{ isSendingInvoice() ? 'Sending...' : 'Send WhatsApp' }}
        </button>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading()" class="card-body text-center py-5">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>
</div>
