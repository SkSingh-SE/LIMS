<div class="container-fluid p-3">
  <!-- Page Header (standardized with account module) -->
  <div class="page-header d-flex justify-content-between align-items-center">
    <div>
      <h4 class="page-title mb-0">
        <i class="bi bi-receipt me-2"></i>Invoice Preview
      </h4>
      <p class="page-subtitle">Preview and send invoice to customer</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm" (click)="printInvoice()">
        <i class="bi bi-printer me-1"></i> Print
      </button>
      <button class="btn btn-outline-secondary btn-sm" (click)="goBack()">
        <i class="bi bi-arrow-left me-1"></i> Back
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="card border-0 shadow-sm mt-3" *ngIf="!isLoading()">
    <div class="card-body">
      <div class="alert alert-info">
        <i class="bi bi-info-circle me-2"></i>
        Invoice preview functionality. In a production system, this would display the actual invoice PDF or formatted invoice.
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <button
          class="btn btn-primary btn-lg"
          (click)="sendInvoice('email')"
          [disabled]="isSendingInvoice()"
        >
          <span *ngIf="isSendingInvoice()" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!isSendingInvoice()" class="bi bi-envelope me-2"></i>
          {{ isSendingInvoice() ? 'Sending...' : 'Send Email' }}
        </button>
        <button
          class="btn btn-primary btn-lg"
          (click)="sendInvoice('whatsapp')"
          [disabled]="isSendingInvoice()"
        >
          <span *ngIf="isSendingInvoice()" class="spinner-border spinner-border-sm me-2"></span>
          <i *ngIf="!isSendingInvoice()" class="bi bi-whatsapp me-2"></i>
          {{ isSendingInvoice() ? 'Sending...' : 'Send WhatsApp' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border text-danger" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>
