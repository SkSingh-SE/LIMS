<div class="container-fluid mt-4 d-flex flex-column align-items-center">
    <div class="card basic-data-table w-100">
        <div
            class="card-header card-form-header text-white text-center d-flex justify-content-between align-items-center">
            <label class="text-center text-md fw-medium ms-3">Analysis Technique List</label>
            <a class="btn btn-outline-light me-3" (click)="openModal('create',0)">
                <i class="bi bi-plus-lg"></i> Create Analysis Technique
            </a>
        </div>

        <div class="card-body">

            <!-- Search -->
            <div class="d-flex justify-content-end mb-2">
                <div class="w-25 input-group custom-search">
                    <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchTerm"
                        (keydown.enter)="onSearch()">
                    <div class="input-group-text pe-auto" (click)="onSearch()">
                        <i class="bi bi-search"></i>
                    </div>
                </div>
            </div>

            <div *ngIf="techniqueList.length > 0 || filters.length > 0" class="table-responsive ">
                <table class="table bordered-table  align-middle w-100">
                    <thead class="table-light">
                        <tr class="text-center align-middle">
                            <th class="align-middle text-center" style="width: 130px; min-width: 130px;">Actions</th>
                            <th *ngFor="let column of columns; let i = index">
                                <div class="d-flex align-items-center">
                                    <span class="dt-column-order">{{ column.label }}</span>
                                    <span class="d-flex flex-column ms-2 mt-2">
                                        <i class="bi bi-caret-up sorting-icon-up"
                                            [ngClass]="{'text-danger': sortByColumn === column.key && sortOrder === 'asc'}"
                                            (click)="applySorting(column.key)"></i>
                                        <i class="bi bi-caret-down sorting-icon-down"
                                            [ngClass]="{'text-danger': sortByColumn === column.key && sortOrder === 'desc'}"
                                            (click)="applySorting(column.key)"></i>
                                    </span>
                                    <span *ngIf="!hasFilter(column.key) && column.filter" class="cursor ms-2 mt-1"
                                        (click)="openFilterModal(column.key, $event)"><i
                                            class="bi bi-funnel"></i></span>
                                    <span *ngIf="hasFilter(column.key) && column.filter" class="cursor ms-1 mt-1"
                                        (click)="resetFilter(column.key)"><i class="bi bi-x-lg text-danger"></i></span>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of techniqueList; let i = index" class="text-sm">
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-3">
                                    <a (click)="openModal('view',item.id)" class="icon-link" title="View">
                                        <img src="/icons/view.svg" alt="View" class="icon-svg">
                                    </a>
                                    <a (click)="openModal('edit',item.id)" class="icon-link" title="Edit">
                                        <img src="/icons/edit.svg" alt="Edit" class="icon-svg">
                                    </a>
                                    <a (click)="deleteTechnique(item.id)" class="icon-link" title="Delete">
                                        <img src="/icons/delete.svg" alt="Delete" class="icon-svg">
                                    </a>
                                </div>
                            </td>
                            <td>{{ (pageNumber - 1) * pageSize + i + 1 }}</td>
                            <td>{{ item.name }}</td>
                            <td>{{ item.code || '-' }}</td>
                            <td>{{ item.aliasNames || '-' }}</td>
                            <td class="text-center">
                                <span class="badge" [ngClass]="item.isSpectro ? 'bg-success' : 'bg-secondary'">
                                    {{ item.isSpectro ? 'Yes' : 'No' }}
                                </span>
                            </td>
                            <td>{{ item.sortOrder }}</td>
                            <td>{{ item.modifiedOn | date:"dd MMM, yyyy hh:mm a" }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div *ngIf="techniqueList.length == 0" class="w-100 h-100 text-center border rounded-3 mb-2">
                <div class="d-flex flex-column align-items-center justify-content-center text-muted py-4">
                    <i class="bi bi-file-earmark-x fs-2 mb-2"></i>
                    <div class="fw-semibold">No records found</div>
                </div>
            </div>

            <!-- Pagination -->
            <app-pagination
              [currentPage]="pageNumber"
              [pageSize]="pageSize"
              [totalItems]="totalItems"
              [pageSizes]="pageSizes"
              (pageChange)="onPageChange($event)"
              (pageSizeChange)="changePageSize($any({ target: { value: $event } }))">
            </app-pagination>

        </div>
    </div>
</div>

<!-- Filter Modal -->
<div #filterModal class="filter-modal">
    <div class="card py-2 px-3 shadow position-relative">
        <button type="button" class="btn-close btn-sm position-absolute top-0 end-0 m-2"
            (click)="closeFilterModal()"></button>

        <label class="fw-medium fs-6 mb-2">Filter: {{ filterColumnTitle | titlecase }}</label>

        <select class="form-select mb-2" [(ngModel)]="filterType">
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] === 'string'" value="Contains">Contains
            </option>
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] === 'date'" value="Between">Between</option>
            <option value="Equal">Equal</option>
            <option value="NotEqual">Not Equal</option>
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] !== 'string'" value="GreaterThan">Greater
                Than</option>
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] !== 'string'" value="LessThan">Less Than
            </option>
        </select>

        <input *ngIf="filterColumnTypes[filterColumn!] === 'string'" type="text" class="form-control mb-2"
            [(ngModel)]="filterValue" placeholder="Enter value" (keydown.enter)="applyFilter()" />
        <input *ngIf="filterColumnTypes[filterColumn] === 'number'" type="number" class="form-control mb-2"
            [(ngModel)]="filterValue" placeholder="Enter number" (keydown.enter)="applyFilter()" />
        <input *ngIf="filterColumnTypes[filterColumn] === 'date' && filterType !== 'Between'" type="date"
            class="form-control mb-2" [(ngModel)]="filterValue" />
        <div *ngIf="filterType === 'Between'" class="d-flex flex-column gap-2">
            <input type="date" class="form-control mb-2" [(ngModel)]="filterValue" placeholder="Start date" />
            <input type="date" class="form-control mb-2" [(ngModel)]="filterValue2" placeholder="End date" />
        </div>

        <button class="btn btn-primary btn-sm mb-2" (click)="applyFilter()">Apply</button>
    </div>
</div>

<!-- Modal for Add/Edit/View Analysis Technique -->
<div id="analysisTechniqueModel" class="modal fade modal-fade" #modalRef tabindex="-1" data-bs-backdrop="static"
    data-bs-keyboard="false" aria-labelledby="analysisTechniqueModelLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header card-form-header text-white">
                <label class="modal-title fw-medium" id="analysisTechniqueModelLabel">
                    {{formTitle}}
                </label>
                <button type="button" class="btn-close btn-close-white" aria-label="Close"
                    (click)="closeModal()"></button>
            </div>
            <form [formGroup]="techniqueForm" (ngSubmit)="onSubmit()">
                <div class="modal-body">
                    <div class="row">
                        <!-- Name -->
                        <div class="mb-1 col-8">
                            <label for="name" class="form-label">Technique Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" class="form-control" formControlName="name"
                                placeholder="e.g. OES" maxlength="100"
                                [ngClass]="{'is-invalid': isFieldInvalid('name')}"
                                [attr.disabled]="isViewMode ? true : null" />
                            <app-field-error [control]="techniqueForm.get('name')" label="Technique Name" [submitted]="submitted"/>
                        </div>

                        <!-- Code -->
                        <div class="mb-1 col-4">
                            <label for="code" class="form-label">Code</label>
                            <input type="text" id="code" class="form-control" formControlName="code"
                                placeholder="e.g. OES" maxlength="40"
                                [ngClass]="{'is-invalid': isFieldInvalid('code')}"
                                [attr.disabled]="isViewMode ? true : null" />
                            <app-field-error [control]="techniqueForm.get('code')" label="Code" [submitted]="submitted"/>
                        </div>
                    </div>

                    <!-- Aliases -->
                    <div class="mb-1">
                        <label for="aliasNames" class="form-label">Aliases <small class="text-muted">(comma-separated)</small></label>
                        <input type="text" id="aliasNames" class="form-control" formControlName="aliasNames"
                            placeholder="e.g. Spectro Test, Metal Analysis" maxlength="500"
                            [ngClass]="{'is-invalid': isFieldInvalid('aliasNames')}"
                            [attr.disabled]="isViewMode ? true : null" />
                        <app-field-error [control]="techniqueForm.get('aliasNames')" label="Aliases" [submitted]="submitted"/>
                    </div>

                    <!-- Description -->
                    <div class="mb-1">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" rows="2" class="form-control" formControlName="description"
                            placeholder="Purpose / typical use" maxlength="1000"
                            [ngClass]="{'is-invalid': isFieldInvalid('description')}"
                            [attr.disabled]="isViewMode ? true : null"></textarea>
                        <app-field-error [control]="techniqueForm.get('description')" label="Description" [submitted]="submitted"/>
                    </div>

                    <div class="row align-items-center">
                        <!-- Sort Order -->
                        <div class="mb-1 col-6">
                            <label for="sortOrder" class="form-label">Sort Order</label>
                            <input type="number" id="sortOrder" class="form-control" formControlName="sortOrder"
                                min="0" [attr.disabled]="isViewMode ? true : null" />
                        </div>

                        <!-- Is Spectro -->
                        <div class="mb-1 col-6 mt-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isSpectro" formControlName="isSpectro"
                                    [attr.disabled]="isViewMode ? true : null" />
                                <label class="form-check-label" for="isSpectro">Spectrometric technique (OES / LECO / XRF)</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div *ngIf="!isViewMode" class="modal-footer">
                    <button type="button" class="btn btn-cancel" (click)="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-save">
                        {{ isEditMode ? 'Update' : 'Save' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
