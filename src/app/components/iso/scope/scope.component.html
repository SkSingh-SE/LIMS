<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">ISO Scope Form</label>
      <a routerLink="/scope" class="btn btn-outline-light btn-sm me-3">
        <i class="bi bi-arrow-left"></i> Back to List
      </a>
    </div>
    <div class="card-body">
      <form [formGroup]="scopeForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Section I: Header -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('header')">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">Header Information</span>
          </div>
          <div *ngIf="openSections['header']" class="section-body">
            <div class="row gy-3">
              <div class="col-md-6">
                <app-searchable-dropdown
                  [placeholder]="'Search Laboratory Test Method'"
                  [labelName]="'Laboratory Test Method'"
                  [fetchDataFn]="getLaboratoryTest"
                  (itemSelected)="onLaboratorySelected($event)"
                  [hideLabel]="false"
                  [required]="true"
                  [isDisabled]="isViewMode"
                  [selectedItem]="scopeForm.get('laboratoryTestID')?.value"
                ></app-searchable-dropdown>
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Specifications -->
        <div formArrayName="specifications">
          <div *ngFor="let spec of specifications.controls; let i = index" [formGroupName]="i" class="accordion-section mb-3">
            <div class="section-header" (click)="toggleSpec(i)">
              <i class="bi" [ngClass]="openSpecs[i] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
              <span class="fw-bold ms-2">
                {{ spec.get("testMethodSpecification")?.value || "New Specification" }}
              </span>
              <span class="ms-2 text-muted small">(Parameters: {{ parameters(i).length }})</span>
              <div class="ms-auto d-flex gap-2 align-items-center">
                <button *ngIf="!isViewMode" type="button" class="btn btn-sm btn-add" (click)="addSpecification(); $event.stopPropagation()">
                  <i class="bi bi-plus-circle-dotted"></i> Add Spec
                </button>
                <button *ngIf="!isViewMode && specifications.length > 1" type="button" class="btn btn-sm btn-outline-dark" (click)="removeSpecification(i); $event.stopPropagation()">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <div *ngIf="openSpecs[i]" class="section-body">
              <!-- Test Method Specification Dropdown -->
              <div class="row gy-3 mb-3">
                <div class="col-md-6">
                  <app-searchable-dropdown
                    class="w-100"
                    [placeholder]="'Search Test Specification'"
                    [labelName]="'Test Method Specification'"
                    [fetchDataFn]="getTestMethodSpecification"
                    (itemSelected)="onTestSpecificationSelected($event, i)"
                    [hideLabel]="false"
                    [required]="true"
                    [isDisabled]="isViewMode"
                    [selectedItem]="spec.get('testMethodSpecificationID')?.value"
                  ></app-searchable-dropdown>
                </div>
              </div>

              <!-- Parameters Table -->
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="fw-bold fs-6 mb-0">Parameters</label>
                <div class="d-flex gap-2">
                  <button
                    *ngIf="!isViewMode"
                    type="button"
                    class="btn btn-sm btn-add mt-1"
                    (click)="addParameter(i)"
                  >
                    <i class="bi bi-plus-circle-dotted"></i> Add Parameter
                  </button>
                  <button
                    type="button"
                    class="btn btn-sm btn-scroll-nav mt-1"
                    (click)="scrollToStart(i)"
                    title="Scroll to start"
                  >
                    <i class="bi bi-arrow-left-circle"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-sm btn-scroll-nav mt-1"
                    (click)="scrollToEnd(i)"
                    title="Scroll to end"
                  >
                    <i class="bi bi-arrow-right-circle"></i>
                  </button>
                </div>
              </div>

              <div
                [id]="'scroll-params-' + i"
                formArrayName="parameters"
                class="table-responsive position-relative custom-scroll"
                style="max-height: calc(100vh - 200px)"
              >
                <table class="table spec-table align-middle" style="min-width: 1400px">
                  <thead>
                    <tr class="text-nowrap">
                      <th class="spec-th text-center">#</th>
                      <th class="spec-th text-center">ISO</th>
                      <th class="spec-th wide-input">Parameter</th>
                      <th class="spec-th wide-input">Unit</th>
                      <th class="spec-th wide-input">Qual / Quant</th>
                      <th class="spec-th wide-input">Lower</th>
                      <th class="spec-th wide-input">Upper</th>
                      <th class="spec-th wide-input">Discipline</th>
                      <th class="spec-th wide-input">Group</th>
                      <th class="spec-th wide-input">Sub-Group</th>
                      <th class="spec-th wide-input-xl">Equipment(s)</th>
                      <th *ngIf="!isViewMode" class="spec-th text-center"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let param of parameters(i).controls; let j = index" [formGroupName]="j" class="spec-row">
                      <td class="text-center text-muted small fw-medium">{{ j + 1 }}</td>
                      <td class="text-center">
                        <div class="form-check d-flex justify-content-center">
                          <input class="form-check-input" type="checkbox" formControlName="isUnderISO" [disabled]="isViewMode" />
                        </div>
                      </td>
                      <td class="wide-input">
                        <app-searchable-dropdown
                          class="w-100"
                          [placeholder]="'Search Parameter'"
                          [labelName]="'Parameter'"
                          [fetchDataFn]="getParameter"
                          (itemSelected)="onParameterSelected($event, i, j)"
                          [isDisabled]="isViewMode"
                          [hideLabel]="true"
                          [selectedItem]="param.get('parameterID')?.value"
                        ></app-searchable-dropdown>
                      </td>
                      <td>
                        <select
                          class="form-select wide-input"
                          formControlName="parameterUnitID"
                          [attr.disabled]="true"
                        >
                          <option value="" disabled>Select Unit</option>
                          <option *ngFor="let unit of parameterUnits" [value]="unit.id">{{ unit.name }}</option>
                        </select>
                      </td>
                      <td>
                        <select
                          formControlName="qualitativeQuantitative"
                          class="form-select wide-input"
                          [disabled]="isViewMode"
                        >
                          <option value="" disabled>Select</option>
                          <option value="Qualitative">Qualitative</option>
                          <option value="Quantitative">Quantitative</option>
                        </select>
                      </td>
                      <td>
                        <select
                          class="form-select wide-input"
                          formControlName="lowerLimit"
                          [disabled]="isViewMode || param.get('qualitativeQuantitative')?.value !== 'Quantitative'"
                        >
                          <option value="">Select</option>
                          <option *ngFor="let op of lowerLimitOptions" [value]="op.value">{{ op.label }}</option>
                        </select>
                      </td>
                      <td>
                        <select
                          class="form-select wide-input"
                          formControlName="upperLimit"
                          [disabled]="isViewMode || param.get('qualitativeQuantitative')?.value !== 'Quantitative'"
                        >
                          <option value="">Select</option>
                          <option *ngFor="let op of upperLimitOptions" [value]="op.value">{{ op.label }}</option>
                        </select>
                      </td>
                      <td class="wide-input">
                        <app-searchable-dropdown
                          [placeholder]="'Search Discipline'"
                          [labelName]="'Discipline'"
                          [fetchDataFn]="getDiscipline"
                          (itemSelected)="onDisciplineSelected($event, i, j)"
                          [isDisabled]="isViewMode"
                          [hideLabel]="true"
                          [selectedItem]="param.get('disciplineID')?.value"
                        ></app-searchable-dropdown>
                      </td>
                      <td>
                        <select
                          class="form-select wide-input"
                          formControlName="groupID"
                          (change)="onGroupSelected($event, i, j)"
                          [disabled]="isViewMode"
                        >
                          <option value="null" disabled>Select Group</option>
                          <option *ngFor="let group of groupOptionsPerParam[i + '-' + j] || []" [value]="group.id">{{ group.name }}</option>
                        </select>
                      </td>
                      <td>
                        <select
                          class="form-select wide-input"
                          formControlName="subGroupID"
                          [disabled]="isViewMode"
                        >
                          <option value="null" disabled>Select Sub Group</option>
                          <option *ngFor="let subGroup of subGroupOptionsPerParam[i + '-' + j] || []" [value]="subGroup.id">
                            {{ subGroup.name }}
                          </option>
                        </select>
                      </td>
                      <td class="wide-input-xl">
                        <app-searchable-dropdown-modal
                          class="w-100"
                          [placeholder]="'Search Equipment'"
                          [labelName]="'Equipment'"
                          [fetchDataFn]="getEquipment"
                          [isMultiSelect]="true"
                          [hideLabel]="true"
                          [isDisabled]="isViewMode"
                          [selectedItem]="param.get('equipmentIDs')?.value"
                          (itemsSelected)="onEquipmentSelect($event, i, j)"
                        ></app-searchable-dropdown-modal>
                      </td>
                      <td *ngIf="!isViewMode" class="text-center">
                        <button type="button" class="btn btn-outline-danger spec-delete-btn" (click)="removeParameter(i, j)">
                          <i class="bi bi-trash3"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-2 mt-4">
          <a [routerLink]="['/scope']" class="btn btn-cancel">Cancel</a>
          <button type="submit" class="btn btn-save px-3">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
