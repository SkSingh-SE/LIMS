<div class="login-wrapper d-flex align-items-center justify-content-center p-3">
    <div class="card login-card shadow-lg border-0">
        <div class="row g-0 align-items-stretch">
            
            <!-- Logo Section (Left on Desktop/Tablet, Top on Mobile) -->
            <div class="col-12 col-md-5 logo-section d-flex align-items-center justify-content-center">
                <img src="/images/login_logo.png" alt="Logo" class="img-fluid login-logo" />
            </div>

            <!-- Vertical Divider (Visible on md screens and up) -->
            <div class="d-none d-md-flex col-auto align-items-center py-4">
                <div class="vr h-75 divider-line"></div>
            </div>

            <!-- Login Form Section (Right on Desktop/Tablet, Bottom on Mobile) -->
            <div class="col-12 col-md p-4 p-sm-4 p-lg-5 d-flex flex-column justify-content-center">
                <h5 class="text-uppercase fw-bold text-dark mb-4 d-flex flex-column">
                    <span class="border-danger header-border"></span>
                    <span class="pb-1">Login</span>
                </h5>

                <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
                    <!-- Username / Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="text" id="email" class="form-control" formControlName="email"
                            placeholder="Enter Email"
                            [ngClass]="{'is-invalid': isFieldInvalid('email')}"/>
                        <app-field-error [control]="loginForm.get('email')" label="Email" [submitted]="submitted"/>
                    </div>

                    <!-- Password -->
                    <div class="mb-3 position-relative">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <input [type]="showPassword() ? 'text' : 'password'" id="password" class="form-control"
                                formControlName="password" placeholder="Enter Password"
                                aria-describedby="password-icon"
                                [ngClass]="{'is-invalid': isFieldInvalid('password')}" />
                            <span type="button" (click)="togglePassword()" class="input-group-text cursor-pointer" id="password-icon"
                                [ngClass]="{'is-invalid': isFieldInvalid('password')}">
                                <i class="bi" [ngClass]="showPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
                            </span>
                        </div>
                        <app-field-error [control]="loginForm.get('password')" label="Password" [submitted]="submitted"/>
                    </div>

                    <!-- Login Button -->
                    <div class="d-grid mt-4">
                        <button class="btn btn-danger py-2 d-flex align-items-center justify-content-center" type="submit" [disabled]="isLoading()">
                            <span *ngIf="isLoading()" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            <span>{{ isLoading() ? 'Logging in...' : 'Login' }}</span>
                        </button>
                        <div *ngIf="errorMessage()" class="alert alert-danger p-1 mt-2 text-center small" role="alert">
                            {{ errorMessage() }}
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
