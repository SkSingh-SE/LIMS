<div class="container-fluid d-flex flex-column align-items-center">
  <div class="card basic-data-table w-100">

    <div class="card-header card-form-header text-white text-center d-flex justify-content-between align-items-center">
      <label class="text-center text-md fw-medium ms-3">Menu Management</label>
      <a routerLink="/menu/create" class="btn btn-outline-light me-3">
        <i class="bi bi-plus-lg"></i> Add Menu
      </a>
    </div>

    <div class="card-body">

      <!-- Toolbar -->
      <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" (click)="expandAll()">
            <i class="bi bi-chevron-double-down"></i> Expand All
          </button>
          <button class="btn btn-sm btn-outline-secondary" (click)="collapseAll()">
            <i class="bi bi-chevron-double-up"></i> Collapse All
          </button>
        </div>
        <div class="input-group custom-search" style="width: 260px;">
          <input type="text" class="form-control" placeholder="Search menus..." [(ngModel)]="searchTerm"
            (ngModelChange)="searchTerm=$event; onSearch()" (keydown.enter)="onSearch()">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
        </div>
      </div>

      <!-- Tree Table -->
      <div class="table-responsive" *ngIf="flatNodes.length > 0">
        <table class="table bordered-table align-middle w-100 menu-tree-table">
          <thead class="table-light">
            <tr class="text-center align-middle">
              <th style="width: 100px;">Actions</th>
              <th class="text-start">Title</th>
              <th style="width: 80px;">Level</th>
              <th class="text-start" style="min-width: 120px;">Icon</th>
              <th class="text-start">Route</th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngFor="let node of flatNodes">
              <tr *ngIf="node.visible" class="text-sm" [class.menu-root-row]="node.depth === 0"
                [class.menu-child-row]="node.depth > 0">

                <!-- Actions -->
                <td class="text-center">
                  <div class="d-flex justify-content-center gap-2">
                    <a [routerLink]="['/menu/details', node.id]" [state]="{ mode: 'view' }" class="icon-link"
                      title="View">
                      <img src="/icons/view.svg" alt="View" class="icon-svg">
                    </a>
                    <a [routerLink]="['/menu/edit', node.id]" [state]="{ mode: 'edit' }" class="icon-link"
                      title="Edit">
                      <img src="/icons/edit.svg" alt="Edit" class="icon-svg">
                    </a>
                  </div>
                </td>

                <!-- Title with indent + toggle -->
                <td>
                  <div class="d-flex align-items-center" [style.paddingLeft]="depthPadding(node.depth)">
                    <!-- Toggle button -->
                    <span *ngIf="node.hasChildren" class="tree-toggle me-2" (click)="toggle(node)"
                      title="{{ node.expanded ? 'Collapse' : 'Expand' }}">
                      <i class="bi" [ngClass]="node.expanded ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
                    </span>
                    <span *ngIf="!node.hasChildren" class="tree-leaf-spacer me-2">
                      <i class="bi bi-dot text-muted"></i>
                    </span>

                    <!-- Folder / page icon -->
                    <i class="bi me-2 text-muted"
                      [ngClass]="node.hasChildren ? 'bi-folder2' : 'bi-file-earmark-text'"></i>

                    <span [class.fw-semibold]="node.depth === 0" [class.text-primary]="node.depth === 0">
                      {{ node.title }}
                    </span>
                  </div>
                </td>

                <!-- Level badge -->
                <td class="text-center">
                  <span class="badge" [ngClass]="depthBadgeClass(node.depth)">{{ depthLabel(node.depth) }}</span>
                </td>

                <!-- Icon class -->
                <td>
                  <span *ngIf="node.icon" class="d-flex align-items-center gap-1">
                    <i class="bi {{ node.icon }}"></i>
                    <small class="text-muted">{{ node.icon }}</small>
                  </span>
                  <span *ngIf="!node.icon" class="text-muted">—</span>
                </td>

                <!-- Route -->
                <td>
                  <code *ngIf="node.route" class="text-success small">{{ node.route }}</code>
                  <span *ngIf="!node.route" class="text-muted">—</span>
                </td>

              </tr>
            </ng-container>
          </tbody>
        </table>
      </div>

      <!-- Empty state -->
      <div *ngIf="flatNodes.length === 0"
        class="w-100 h-100 text-center border rounded-3 mb-2">
        <div class="d-flex flex-column align-items-center justify-content-center text-muted py-4">
          <i class="bi bi-diagram-3 fs-2 mb-2"></i>
          <div class="fw-semibold">No menus found</div>
        </div>
      </div>

    </div>
  </div>
</div>
