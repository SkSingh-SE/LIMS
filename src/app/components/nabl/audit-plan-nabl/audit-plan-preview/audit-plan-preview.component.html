<!-- ════════════════════════════════════════════════════════════════
     ACTION TOOLBAR  (hidden on print)
════════════════════════════════════════════════════════════════ -->
<div class="preview-toolbar no-print">
  <div class="toolbar-left">
    <button class="toolbar-btn btn-outline-dark" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </button>
  </div>

  <div class="toolbar-center">
    <span class="doc-title-label">
      <i class="bi bi-file-text me-1"></i>
      Audit Plan Preview
    </span>
  </div>

  <div class="toolbar-right">
    <div class="orientation-toggle" title="Page orientation">
      <button class="orient-btn" [class.active]="orientation === 'portrait'"
              (click)="setOrientation('portrait')">
        <i class="bi bi-file-earmark"></i>
        <span>Portrait</span>
      </button>
      <button class="orient-btn" [class.active]="orientation === 'landscape'"
              (click)="setOrientation('landscape')">
        <i class="bi bi-file-earmark-text" style="transform:rotate(90deg);display:inline-block;"></i>
        <span>Landscape</span>
      </button>
    </div>
    <button class="toolbar-btn btn-outline-dark" (click)="resetToAuto()"
            title="Auto-detect orientation from content"
            *ngIf="orientationManual">
      <i class="bi bi-arrow-counterclockwise"></i>
      <span>Auto</span>
    </button>
    <button class="toolbar-btn btn-primary-red" (click)="printPage()">
      <i class="bi bi-printer-fill"></i>
      <span>Print</span>
    </button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     DOCUMENT VIEWER
════════════════════════════════════════════════════════════════ -->
<div class="nabl-preview-page">

  <app-print-frame [orientation]="orientation">
    <ng-container header>
      <app-nabl-print-header
        [formatNo]="headerInfo.formatNo"
        [mainTitle]="'AUDIT SCHEDULE & PLAN'"
        [docNo]="headerInfo.docNo"
        [issueNo]="headerInfo.issueNo"
        [issueDate]="headerInfo.issueDate"
        [revNo]="headerInfo.revNo"
      ></app-nabl-print-header>
    </ng-container>

    <ng-container body>
      <div class="doc-section mb-3">
        <div class="sec-title">AUDIT SCHEDULE</div>
        <table class="table table-bordered inner-table text-center align-middle">
          <thead>
            <tr class="tbl-head">
              <th style="width:60px">Sr. No.</th>
              <th style="width:150px">Audit Type</th>
              <th style="width:100px">Period</th>
              <th>Area / Department</th>
              <th>Proposed Auditor(s)</th>
              <th style="width:150px">Schedule Date</th>
              <th>Scope of Audit</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of data; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ item.auditType }}</td>
              <td>{{ item.period }}</td>
              <td class="text-start">{{ item.areaDepartment }}</td>
              <td class="text-start">{{ item.auditorName }}</td>
              <td>{{ item.scheduleDate | date: "dd/MM/yyyy" }}</td>
              <td class="text-start">{{ item.scope }}</td>
            </tr>
            <!-- Empty rows for filling space -->
            <tr *ngIf="data.length < 10">
              <td colspan="7" [style.height.px]="40 * (10 - data.length)"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>

    <ng-container footer>
      <app-nabl-print-footer
        [showSignatures]="true"
        [preparedByName]="'Quality Manager'"
        [issuedByName]="'Quality Manager'"
        [reviewedApprovedByName]="'Managing Director'"
      ></app-nabl-print-footer>
    </ng-container>
  </app-print-frame>

</div>
