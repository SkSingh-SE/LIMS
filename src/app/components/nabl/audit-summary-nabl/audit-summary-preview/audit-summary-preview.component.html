<!-- ════════════════════════════════════════════════════════════════
     ACTION TOOLBAR  (hidden on print)
════════════════════════════════════════════════════════════════ -->
<div class="preview-toolbar no-print">
  <div class="toolbar-left">
    <button class="toolbar-btn btn-outline-dark" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </button>
  </div>

  <div class="toolbar-center">
    <span class="doc-title-label">
      <i class="bi bi-file-text me-1"></i>
      Audit Summary Report
    </span>
  </div>

  <div class="toolbar-right">
    <div class="orientation-toggle" title="Page orientation">
      <button class="orient-btn" [class.active]="orientation === 'portrait'"
              (click)="setOrientation('portrait')">
        <i class="bi bi-file-earmark"></i>
        <span>Portrait</span>
      </button>
      <button class="orient-btn" [class.active]="orientation === 'landscape'"
              (click)="setOrientation('landscape')">
        <i class="bi bi-file-earmark-text" style="transform:rotate(90deg);display:inline-block;"></i>
        <span>Landscape</span>
      </button>
    </div>
    <button class="toolbar-btn btn-outline-dark" (click)="resetToAuto()"
            title="Auto-detect orientation from content"
            *ngIf="orientationManual">
      <i class="bi bi-arrow-counterclockwise"></i>
      <span>Auto</span>
    </button>
    <button class="toolbar-btn btn-primary-red" (click)="printPage()">
      <i class="bi bi-printer-fill"></i>
      <span>Print</span>
    </button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     DOCUMENT VIEWER
════════════════════════════════════════════════════════════════ -->
<div class="nabl-preview-page">

  <!-- Loading State -->
  <div *ngIf="false" class="text-center py-5">
    <div class="spinner-border" style="color: #DA261C;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <app-print-frame *ngIf="data" [orientation]="orientation">
    <ng-container header>
      <app-nabl-print-header
        [formatNo]="data.formatNo"
        [mainTitle]="'AUDIT SUMMARY REPORT'"
        [docNo]="data.docNo"
        [issueNo]="data.issueNo"
        [issueDate]="data.issueDate"
        [revNo]="data.revNo"
      ></app-nabl-print-header>
    </ng-container>

    <ng-container body>

      <!-- Audit Overview -->
      <div class="doc-section mb-3">
        <div class="sec-title">AUDIT OVERVIEW</div>
        <table class="table table-bordered inner-table">
          <tbody>
            <tr>
              <td class="lbl" style="width: 25%">Audit Date</td>
              <td style="width: 25%">{{ data.auditDate | date: "dd.MM.yyyy" }}</td>
              <td class="lbl" style="width: 25%">Areas Covered</td>
              <td style="width: 25%">{{ data.areasCovered }}</td>
            </tr>
            <tr>
              <td class="lbl">Total Major NCs</td>
              <td>{{ data.majorNCs }}</td>
              <td class="lbl">Total Minor NCs</td>
              <td>{{ data.minorNCs }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 1. Observations Summary -->
      <div class="doc-section mb-3">
        <div class="sec-title">1. OBSERVATIONS SUMMARY</div>
        <div class="sec-body" [innerHTML]="data.observationSummary"></div>
      </div>

      <!-- 2. Conclusion -->
      <div class="doc-section mb-3">
        <div class="sec-title">2. CONCLUSION</div>
        <div class="sec-body" [innerHTML]="data.conclusion"></div>
      </div>

      <div class="mt-4 text-center">
        <p><em>End of Report</em></p>
      </div>

    </ng-container>

    <ng-container footer>
      <app-nabl-print-footer
        [showSignatures]="true"
        [preparedByName]="'Auditor'"
        [issuedByName]="'Quality Manager'"
        [reviewedApprovedByName]="'Managing Director'"
      ></app-nabl-print-footer>
    </ng-container>
  </app-print-frame>

</div>
