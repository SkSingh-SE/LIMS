<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <!-- Action Bar -->
  <div class="d-flex justify-content-between w-100 mb-3 no-print container-width">
    <button class="btn btn-dark btn-sm" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      Back to List
    </button>
    <button class="btn navbar-background text-white btn-sm" (click)="printPage()">
      <i class="bi bi-printer"></i>
      Print
    </button>
  </div>

  <app-print-frame *ngIf="!isLoading() && data" orientation="portrait">
    <ng-container header>
      <app-nabl-print-header
        [formatNo]="data.formatNo"
        [mainTitle]="'AUDIT SUMMARY REPORT'"
        [docNo]="data.docNo"
        [issueNo]="data.issueNo"
        [issueDate]="data.issueDate"
        [revNo]="data.revNo"
      ></app-nabl-print-header>
    </ng-container>

    <ng-container body>
      <div class="summary-info border border-dark p-2 mb-4">
        <div class="row">
          <div class="col-6">
            <strong>Audit Date:</strong>
            {{ data.auditDate | date: "dd.MM.yyyy" }}
          </div>
          <div class="col-6">
            <strong>Areas Covered:</strong>
            {{ data.areasCovered }}
          </div>
        </div>
        <div class="row mt-2">
          <div class="col-6">
            <strong>Total Major NCs:</strong>
            {{ data.majorNCs }}
          </div>
          <div class="col-6">
            <strong>Total Minor NCs:</strong>
            {{ data.minorNCs }}
          </div>
        </div>
      </div>

      <div class="summary-section mb-4">
        <div class="fw-bold bg-light border border-dark p-2 mb-0">1. OBSERVATIONS SUMMARY:</div>
        <div class="border border-top-0 border-dark p-3">
          <div class="ql-editor" [innerHTML]="data.observationSummary"></div>
        </div>
      </div>

      <div class="summary-section mb-4">
        <div class="fw-bold bg-light border border-dark p-2 mb-0">2. CONCLUSION:</div>
        <div class="border border-top-0 border-dark p-3">
          <div class="ql-editor" [innerHTML]="data.conclusion"></div>
        </div>
      </div>

      <div class="mt-5 text-center">
        <p><em>End of Report</em></p>
      </div>
    </ng-container>

    <ng-container footer>
      <app-nabl-print-footer
        [showSignatures]="true"
        [preparedByName]="'Auditor'"
        [issuedByName]="'Quality Manager'"
        [reviewedApprovedByName]="'Managing Director'"
      ></app-nabl-print-footer>
    </ng-container>
  </app-print-frame>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</div>
