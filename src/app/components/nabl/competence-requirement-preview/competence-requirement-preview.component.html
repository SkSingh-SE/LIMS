<div class="container-fluid mt-4 d-flex flex-column align-items-center">
    <!-- Action Bar (hidden on print) -->
    <div class="d-flex justify-content-between w-100 mb-3 no-print container-width">
        <button class="btn btn-dark btn-sm" (click)="goBack()">
            <i class="bi bi-arrow-left"></i> Back to List
        </button>
        <button class="btn navbar-background text-white btn-sm" (click)="printPage()">
            <i class="bi bi-printer"></i> Print
        </button>
    </div>

    <app-print-frame *ngIf="!isLoading && requirement" orientation="portrait">
      <ng-container header>
        <!-- Reusable Document Header -->
        <app-nabl-print-header
            formatNo="F-7C"
            mainTitle="COMPETENCE REQUIREMENT DOCUMENT"
            [docNo]="'DMSPL / Level-04 / Format / F-7C'"
            [issueNo]="'01'"
            [revNo]="'00'">
        </app-nabl-print-header>
      </ng-container>

      <ng-container body>
        <!-- Content Table -->
        <table class="table table-bordered mb-3 info-table border-2 border-dark">
          <tbody>
            <tr>
              <td class="label-cell border-2 border-dark" style="width: 25%;">Position / Activity</td>
              <td class="fw-bold fs-5 border-2 border-dark text-black">{{ getDisplayText() }}</td>
            </tr>
            <tr>
              <td class="label-cell border-2 border-dark">Requirement Type</td>
              <td class="border-2 border-dark text-black">{{ requirement.isExternal ? 'External Activity Provider' : 'Internal Staff' }}</td>
            </tr>
          </tbody>
        </table>

        <div class="section mb-3 border-2 border-dark">
          <div class="section-title border-bottom-2">Educational / Technical Requirements</div>
          <div class="section-content ql-editor p-3 text-black" [innerHTML]="requirement.minimumEducation"></div>
        </div>

        <div class="section mb-3 border-2 border-dark">
          <div class="section-title border-bottom-2">Experience Requirements</div>
          <div class="section-content p-3 text-black" style="white-space: pre-wrap;">{{ requirement.minimumExperience }}</div>
        </div>

        <!-- Acceptance/Approval specifically for F-7C -->
        <table class="table table-bordered mb-4 border-2 border-dark">
          <tbody>
            <tr>
              <td class="label-cell border-2 border-dark" style="width: 25%;">Approved By</td>
              <td class="border-2 border-dark text-black">{{ requirement.approvedBy }}</td>
              <td class="label-cell border-2 border-dark" style="width: 20%;">Signature</td>
              <td class="signature-cell border-2 border-dark" style="width: 20%;"></td>
            </tr>
          </tbody>
        </table>
      </ng-container>

      <ng-container footer>
        <app-nabl-print-footer></app-nabl-print-footer>
      </ng-container>
    </app-print-frame>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>
