<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <!-- Main Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">{{ formTitle }}</label>
      <button type="button" class="btn btn-outline-light btn-sm me-3" routerLink="/employee/equipment-authorization/list">
        <i class="bi bi-arrow-left"></i> Back to List
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="authForm" (ngSubmit)="onSubmit()">

        <!-- Section I: Personnel Details -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('details')">
            <i class="bi" [ngClass]="openSections['details'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">I. Personnel Details</span>
          </div>
          <div *ngIf="openSections['details']" class="section-body">
            <div class="row g-3">
              <!-- Form Number -->
              <div class="col-md-3">
                <label class="form-label">Form Number <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="formatNo"
                  [ngClass]="{'is-invalid': authForm.get('formatNo')?.invalid && authForm.get('formatNo')?.touched}">
                  <option value="" disabled>Select Form</option>
                  <option *ngFor="let form of formNumbers" [value]="form">{{ form }}</option>
                </select>
              </div>

              <!-- Department Dropdown -->
              <div class="col-md-3">
                <app-searchable-dropdown
                  class="w-100"
                  [placeholder]="'Search Department'"
                  [labelName]="'Department'"
                  [fetchDataFn]="getDepartments"
                  (itemSelected)="onDepartmentSelected($event)"
                  [hideLabel]="false"
                  [required]="true"
                  [isDisabled]="isViewMode"
                  [selectedItem]="authForm.get('departmentId')?.value"
                ></app-searchable-dropdown>
                <div *ngIf="authForm.get('departmentId')?.invalid && authForm.get('departmentId')?.touched" class="text-danger text-sm mt-1">
                  Department is required
                </div>
              </div>

              <!-- Employee Dropdown -->
              <div class="col-md-3">
                <app-searchable-dropdown
                  class="w-100"
                  [placeholder]="'Search Employee'"
                  [labelName]="'Personnel Name'"
                  [fetchDataFn]="getEmployees"
                  (itemSelected)="onEmployeeSelected($event)"
                  [hideLabel]="false"
                  [required]="true"
                  [isDisabled]="isViewMode"
                  [selectedItem]="authForm.get('employeeId')?.value"
                ></app-searchable-dropdown>
                <div *ngIf="authForm.get('employeeId')?.invalid && authForm.get('employeeId')?.touched" class="text-danger text-sm mt-1">
                  Employee is required
                </div>
              </div>

              <!-- UID (auto-filled from employee) -->
              <div class="col-md-3">
                <label class="form-label">Personnel UID</label>
                <input type="text" class="form-control" formControlName="uid" placeholder="Auto-filled from employee" readonly />
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Equipment & Authorization -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('equipment')">
            <i class="bi" [ngClass]="openSections['equipment'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">II. Equipment & Authorization</span>
          </div>
          <div *ngIf="openSections['equipment']" class="section-body">
            <div class="row g-3">
              <!-- Equipment -->
              <div class="col-md-12">
                <label class="form-label fw-bold">Equipment List <span class="text-danger">*</span></label>
                <quill-editor formControlName="equipment" [modules]="quillModules" [readOnly]="isViewMode"
                  placeholder="List down authorized equipment with details..."></quill-editor>
                <div *ngIf="authForm.get('equipment')?.invalid && authForm.get('equipment')?.touched" class="text-danger text-sm mt-1">
                  Equipment list is required
                </div>
              </div>

              <!-- Test Method Authorization -->
              <div class="col-md-6 mt-3">
                <label class="form-label">Test Method Authorization <span class="text-danger">*</span></label>
                <textarea class="form-control" formControlName="testMethodAuthorization" rows="3"
                  placeholder="Enter authorized test methods (e.g., IS 1608, ASTM E8, ASTM E92...)"
                  [ngClass]="{'is-invalid': authForm.get('testMethodAuthorization')?.invalid && authForm.get('testMethodAuthorization')?.touched}">
                </textarea>
                <div *ngIf="authForm.get('testMethodAuthorization')?.invalid && authForm.get('testMethodAuthorization')?.touched" class="text-danger text-sm mt-1">
                  Test method authorization is required
                </div>
              </div>

              <!-- Test Authorization -->
              <div class="col-md-6 mt-3">
                <label class="form-label">Test Authorization <span class="text-danger">*</span></label>
                <textarea class="form-control" formControlName="testAuthorization" rows="3"
                  placeholder="Enter authorized tests (e.g., Tensile Test, Hardness Test, Impact Test...)"
                  [ngClass]="{'is-invalid': authForm.get('testAuthorization')?.invalid && authForm.get('testAuthorization')?.touched}">
                </textarea>
                <div *ngIf="authForm.get('testAuthorization')?.invalid && authForm.get('testAuthorization')?.touched" class="text-danger text-sm mt-1">
                  Test authorization is required
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-cancel" routerLink="/employee/equipment-authorization/list">Cancel</button>
          <button type="submit" class="btn btn-save" [disabled]="authForm.invalid || isSubmitting">
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status"></span>
            <i *ngIf="!isSubmitting" class="bi bi-save me-1"></i>
            {{ isEditMode ? 'Update' : 'Save' }} Authorization
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
