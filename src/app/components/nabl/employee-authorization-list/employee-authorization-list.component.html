<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <app-nabl-register-table
    [title]="'Equipment Authorizations (F-7B)'"
    [addButtonLabel]="'Create Authorization'"
    [addRoute]="'/employee/equipment-authorization/create'"
    [baseRoute]="'/employee/equipment-authorization'"
    [columns]="columns"
    [data]="records"
    [totalItems]="totalItems"
    [isLoading]="false"
    [showSerialNumber]="true"
    [showActions]="true"
    [showPagination]="true"
    (onPageChange)="onPageChange($event)"
    (onDelete)="onDelete($event)">
  </app-nabl-register-table>
</div>
