<!-- ════════════════════════════════════════════════════════════════
     ACTION TOOLBAR  (hidden on print)
════════════════════════════════════════════════════════════════ -->
<div class="preview-toolbar no-print">
  <div class="toolbar-left">
    <button class="toolbar-btn btn-outline-dark" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </button>
  </div>

  <div class="toolbar-center">
    <span class="doc-title-label">
      <i class="bi bi-file-text me-1"></i>
      Employee Authorization Matrix
    </span>
  </div>

  <div class="toolbar-right">
    <div class="orientation-toggle" title="Page orientation">
      <button class="orient-btn" [class.active]="orientation === 'portrait'"
              (click)="setOrientation('portrait')">
        <i class="bi bi-file-earmark"></i>
        <span>Portrait</span>
      </button>
      <button class="orient-btn" [class.active]="orientation === 'landscape'"
              (click)="setOrientation('landscape')">
        <i class="bi bi-file-earmark-text" style="transform:rotate(90deg);display:inline-block;"></i>
        <span>Landscape</span>
      </button>
    </div>
    <button class="toolbar-btn btn-outline-dark" (click)="resetToAuto()"
            title="Auto-detect orientation from content"
            *ngIf="orientationManual">
      <i class="bi bi-arrow-counterclockwise"></i>
      <span>Auto</span>
    </button>
    <button class="toolbar-btn btn-primary-red" (click)="printPage()">
      <i class="bi bi-printer-fill"></i>
      <span>Print</span>
    </button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     DOCUMENT VIEWER
════════════════════════════════════════════════════════════════ -->
<div class="nabl-preview-page">

  <app-print-frame *ngIf="authorizations && authorizations.length > 0" [orientation]="orientation">
    <ng-container header>
      <app-nabl-print-header
          [formatNo]="'F-7B'"
          [mainTitle]="'EQUIPMENT AUTHORIZATION (On Site)'"
          [docNo]="'DMSPL / Level-04 / Format / F-7'"
          [issueNo]="'01'"
          [revNo]="'01 / 05.03.2025'">
      </app-nabl-print-header>
    </ng-container>

    <ng-container body>
      <div class="doc-section mb-3">
        <div class="sec-title">AUTHORIZATION MATRIX</div>
        <table class="table table-bordered inner-table">
          <thead>
            <tr class="tbl-head text-center">
              <th>Department</th>
              <th>Personnel</th>
              <th>UID</th>
              <th>Equipment</th>
              <th>Test Method Authorization</th>
              <th>Test Authorization</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of authorizations">
              <td>{{ row.department }}</td>
              <td>{{ row.personnelName }}</td>
              <td>{{ row.uid }}</td>
              <td>{{ row.equipment }}</td>
              <td>{{ row.testMethodAuthorization }}</td>
              <td>{{ row.testAuthorization }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>

    <ng-container footer>
      <app-nabl-print-footer
          [preparedByName]="'General Manager'"
          [issuedByName]="'Quality Manager'"
          [reviewedApprovedByName]="'Managing Director'">
      </app-nabl-print-footer>
    </ng-container>
  </app-print-frame>

</div>
