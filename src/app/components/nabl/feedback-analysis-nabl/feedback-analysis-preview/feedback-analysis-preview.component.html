<!-- ════════════════════════════════════════════════════════════════
     ACTION TOOLBAR  (hidden on print)
════════════════════════════════════════════════════════════════ -->
<div class="preview-toolbar no-print">
  <div class="toolbar-left">
    <button class="toolbar-btn btn-outline-dark" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </button>
  </div>
  <div class="toolbar-center">
    <span class="doc-title-label">
      <i class="bi bi-file-text me-1"></i>
      Feedback Analysis Preview
    </span>
  </div>
  <div class="toolbar-right">
    <div class="orientation-toggle" title="Page orientation">
      <button class="orient-btn" [class.active]="orientation === 'portrait'"
              (click)="setOrientation('portrait')">
        <i class="bi bi-file-earmark"></i>
        <span>Portrait</span>
      </button>
      <button class="orient-btn" [class.active]="orientation === 'landscape'"
              (click)="setOrientation('landscape')">
        <i class="bi bi-file-earmark-text" style="transform:rotate(90deg);display:inline-block;"></i>
        <span>Landscape</span>
      </button>
    </div>
    <button class="toolbar-btn btn-outline-dark" (click)="resetToAuto()"
            title="Auto-detect orientation from content"
            *ngIf="orientationManual">
      <i class="bi bi-arrow-counterclockwise"></i>
      <span>Auto</span>
    </button>
    <button class="toolbar-btn btn-primary-red" (click)="printPage()">
      <i class="bi bi-printer-fill"></i>
      <span>Print</span>
    </button>
  </div>
</div>

<div class="nabl-preview-page">
  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border" style="color: #DA261C;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
  <app-print-frame *ngIf="!isLoading() && data" [orientation]="orientation">
    <ng-container header>
      <app-nabl-print-header
        [formatNo]="data.formatNo"
        [mainTitle]="'CUSTOMER FEEDBACK ANALYSIS'"
        [docNo]="data.docNo"
        [issueNo]="data.issueNo"
        [issueDate]="data.issueDate"
        [revNo]="data.revNo"
      ></app-nabl-print-header>
    </ng-container>

    <ng-container body>
      <div class="doc-section mb-3">
        <div class="sec-title">ANALYSIS DETAILS</div>
        <table class="table table-bordered inner-table">
          <tbody>
            <tr>
              <td class="lbl" style="width: 30%">Period of Analysis</td>
              <td style="width: 35%">{{ data.period }}</td>
              <td class="lbl" style="width: 20%">Total Feedback Received</td>
              <td style="width: 15%">{{ data.totalFeedbackReceived }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="doc-section mb-3">
        <div class="sec-title">1. ANALYSIS SUMMARY</div>
        <div class="sec-body" [innerHTML]="data.analysisSummary"></div>
      </div>

      <div class="doc-section mb-3">
        <div class="sec-title">2. ACTION TAKEN / PREVENTIVE ACTIONS</div>
        <div class="sec-body" [innerHTML]="data.actionsTaken"></div>
      </div>

      <div class="mt-5 text-center">
        <p><em>End of Report</em></p>
      </div>
    </ng-container>

    <ng-container footer>
      <app-nabl-print-footer
        [showSignatures]="true"
        [preparedByName]="'General Manager'"
        [issuedByName]="'Quality Manager'"
        [reviewedApprovedByName]="'Managing Director'"
      ></app-nabl-print-footer>
    </ng-container>
  </app-print-frame>
</div>
