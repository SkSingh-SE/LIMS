<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg border-0">
    <!-- Premium Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center">
        <i class="bi bi-box-seam-fill fs-4 me-2"></i>
        <header class="text-md fw-medium">{{ formTitle }}</header>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-light btn-sm px-3" (click)="onCancel()">
          <i class="bi bi-arrow-left me-1"></i> Back to List
        </button>
      </div>
    </div>

    <div class="card-body p-4">
      <form [formGroup]="materialForm" (ngSubmit)="onSubmit()" [class.ra-form-disabled]="materialForm.disabled">

        <!-- Section I: Header Information -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('header')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">I. Document Control Information</span>
          </div>
          <div *ngIf="openSections['header']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Form Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="formatNo" list="formNumbers" placeholder="e.g. F-24">
                <datalist id="formNumbers">
                  <option *ngFor="let form of formNumbers" [value]="form"></option>
                </datalist>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Issue No <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" formControlName="issueNo" readonly>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Rev No <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" formControlName="revNo" readonly>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control bg-light" formControlName="date" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Record Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="documentNo" placeholder="DMSPL-IM-YYYY-XXX">
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Material & Receipt Details -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('material')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['material'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">II. Material & Receipt Information</span>
          </div>
          <div *ngIf="openSections['material']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Material Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="materialName">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Material Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="materialCode">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Supplier Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="supplierName">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Batch No <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="batchNo">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Lot No.</label>
                <input type="text" class="form-control shadow-sm" formControlName="lotNo">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Quantity Received <span class="text-danger">*</span></label>
                <input type="number" class="form-control shadow-sm" formControlName="quantityReceived">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Unit <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="unitOfMeasure">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Invoice No <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="invoiceNo">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">GRN No.</label>
                <input type="text" class="form-control shadow-sm" formControlName="grnNo">
              </div>
            </div>
          </div>
        </div>

        <!-- Section III: Inspection Results -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('results')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['results'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">III. Inspection Parameters & Observations</span>
          </div>
          <div *ngIf="openSections['results']" class="section-body p-0 border border-top-0 rounded-bottom">
            <div class="table-responsive">
              <table class="table table-bordered align-middle sm-table mb-0">
                <thead class="table-light align-middle text-center">
                  <tr>
                    <th style="width: 50px;">SN</th>
                    <th>Parameter Name <span class="text-danger">*</span></th>
                    <th>Standard Requirement <span class="text-danger">*</span></th>
                    <th>Observation <span class="text-danger">*</span></th>
                    <th style="width: 120px;">Result <span class="text-danger">*</span></th>
                    <th style="width: 50px;" *ngIf="!isViewMode"></th>
                  </tr>
                </thead>
                <tbody formArrayName="results">
                  <tr *ngFor="let res of resultsArray.controls; let i = index" [formGroupName]="i">
                    <td class="text-center fw-bold text-secondary">{{ i + 1 }}</td>
                    <td>
                      <input type="text" class="form-control form-control-sm border-dashed" formControlName="parameterName">
                    </td>
                    <td>
                      <textarea class="form-control form-control-sm border-dashed" formControlName="requirement" rows="1"></textarea>
                    </td>
                    <td>
                      <textarea class="form-control form-control-sm border-dashed" formControlName="observation" rows="1"></textarea>
                    </td>
                    <td>
                      <select class="form-select form-select-sm border-dashed" formControlName="result">
                        <option *ngFor="let r of results" [value]="r">{{ r }}</option>
                      </select>
                    </td>
                    <td *ngIf="!isViewMode" class="text-center">
                      <button type="button" class="btn btn-remove btn-sm border-0" (click)='removeResult(i)' [disabled]="resultsArray.length <= 1">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="p-2 bg-light border-top" *ngIf="!isViewMode">
              <button type="button" class="btn btn-add btn-sm px-3" (click)="addResult()">
                <i class="bi bi-plus-circle me-1"></i> Add Parameter Result
              </button>
            </div>
          </div>
        </div>

        <!-- Section IV: Outcome & Remarks -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('outcome')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['outcome'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">IV. Inspection Outcome & Signatories</span>
          </div>
          <div *ngIf="openSections['outcome']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">Final Status <span class="text-danger">*</span></label>
                <select class="form-select shadow-sm" formControlName="inspectionStatus">
                  <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
                </select>
              </div>
              <div class="col-12 d-flex flex-column">
                <label class="form-label fw-semibold text-dark small">Deviations Observed</label>
                <quill-editor formControlName="deviations" [modules]="quillModules" placeholder="Enter deviations if any..."></quill-editor>
              </div>
              <div class="col-12 d-flex flex-column">
                <label class="form-label fw-semibold text-dark small">Corrective Actions</label>
                <quill-editor formControlName="correctiveActions" [modules]="quillModules" placeholder="Enter corrective actions taken..."></quill-editor>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Inspected By <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="inspectedBy">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Verified By <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="verifiedBy">
              </div>
            </div>
          </div>
        </div>

        
        <app-nabl-signature-section [parentForm]="materialForm"></app-nabl-signature-section>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-light px-4 fw-semibold border shadow-sm" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-save px-4 fw-semibold shadow-sm" [disabled]="materialForm.invalid">
            <i class="bi bi-check2-circle me-1"></i> {{ isEditMode ? 'Update' : 'Save' }} Record
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
