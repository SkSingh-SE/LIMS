<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <!-- Main Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">{{ formTitle }}</label>
      <button type="button" class="btn btn-outline-light btn-sm me-3" routerLink="/induction-training">
        <i class="bi bi-arrow-left"></i> Back to List
      </button>
    </div>

    <div class="card-body">
      <!-- Loading Overlay -->
      <div *ngIf="isLoading()" class="text-center p-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <form *ngIf="!isLoading()" [formGroup]="trainingForm" (ngSubmit)="onSubmit()" [class.ra-form-disabled]="isViewMode">

        <!-- Section I: Header Information (Mandatory Pattern) -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('header')">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">I. Header Information</span>
            <div class="ms-auto pe-3 text-muted small">NABL Compliance Header</div>
          </div>
          <div *ngIf="openSections['header']" class="section-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Form Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="formatNo" list="formNumbersList" placeholder="e.g. F-6">
                <datalist id="formNumbersList">
                  <option *ngFor="let form of formNumbers" [value]="form"></option>
                </datalist>
              </div>
              <div class="col-md-3">
                <label class="form-label">Issue No</label>
                <input type="text" class="form-control bg-light" formControlName="issueNo" readonly>
              </div>
              <div class="col-md-3">
                <label class="form-label">Rev No</label>
                <input type="text" class="form-control bg-light" formControlName="revNo" readonly>
              </div>
              <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control bg-light" formControlName="date" readonly>
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Employee Details -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('employee')">
            <i class="bi" [ngClass]="openSections['employee'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">II. Employee Details</span>
          </div>
          <div *ngIf="openSections['employee']" class="section-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Employee Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="employeeName" placeholder="Enter Full Name"
                  [ngClass]="{'is-invalid': trainingForm.get('employeeName')?.invalid && trainingForm.get('employeeName')?.touched}">
              </div>
              <div class="col-md-4">
                <label class="form-label">Qualification <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="qualification" placeholder="e.g. B.Sc Chemistry"
                  [ngClass]="{'is-invalid': trainingForm.get('qualification')?.invalid && trainingForm.get('qualification')?.touched}">
              </div>
              <div class="col-md-4">
                <label class="form-label">Date of Joining <span class="text-danger">*</span></label>
                <input type="date" class="form-control" formControlName="dateOfJoining"
                  [ngClass]="{'is-invalid': trainingForm.get('dateOfJoining')?.invalid && trainingForm.get('dateOfJoining')?.touched}">
              </div>
              <div class="col-md-12">
                <label class="form-label">Position in Organization <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="position" placeholder="e.g. Quality Analyst"
                  [ngClass]="{'is-invalid': trainingForm.get('position')?.invalid && trainingForm.get('position')?.touched}">
              </div>
            </div>
          </div>
        </div>

        <!-- Section III: On Job Training -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('training')">
            <i class="bi" [ngClass]="openSections['training'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">III. On Job Training</span>
          </div>
          <div *ngIf="openSections['training']" class="section-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Date of Training <span class="text-danger">*</span></label>
                <input type="date" class="form-control" formControlName="trainingDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Trainer Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="trainerName" placeholder="Enter Trainer's Name">
              </div>
              <div class="col-md-4">
                <label class="form-label">Trainer Designation <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="trainerDesignation" placeholder="e.g. Lab Head">
              </div>
              <div class="col-md-6">
                <label class="form-label">Sample Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="sampleName" placeholder="e.g. Water for Testing">
              </div>
              <div class="col-md-6">
                <label class="form-label">Sample Ref No <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="sampleRefNo" placeholder="e.g. REF-2025-001">
              </div>
              <div class="col-md-6">
                <label class="form-label">Parameter <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="parameter" placeholder="e.g. pH Value">
              </div>
              <div class="col-md-6">
                <label class="form-label">Test Method / SOP <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="testMethodSop" placeholder="e.g. SOP-CHE-01">
              </div>
            </div>
          </div>
        </div>

        <!-- Section IV: Training Evaluation -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('evaluation')">
            <i class="bi" [ngClass]="openSections['evaluation'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">IV. Training Evaluation</span>
          </div>
          <div *ngIf="openSections['evaluation']" class="section-body">
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label">Evaluation Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control" formControlName="evaluationDate">
              </div>
              <div class="col-md-4">
                <label class="form-label">Mode of Evaluation <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="evaluationMode">
                  <option value="Retesting">Retesting</option>
                  <option value="Replicate testing">Replicate testing</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Parameter <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="evalParameter" placeholder="e.g. pH Value">
              </div>
              <div class="col-md-12">
                <label class="form-label">Test Method / SOP <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="evalTestMethodSop" placeholder="e.g. SOP-CHE-01">
              </div>
              
              <div class="col-md-3">
                <label class="form-label">Observed Value-1</label>
                <input type="text" class="form-control" formControlName="observedValue1" placeholder="Val 1">
              </div>
              <div class="col-md-3">
                <label class="form-label">Observed Value-2</label>
                <input type="text" class="form-control" formControlName="observedValue2" placeholder="Val 2">
              </div>
              <div class="col-md-3">
                <label class="form-label">Observed Average</label>
                <input type="text" class="form-control bg-light" formControlName="observedValueAverage" placeholder="Avg" readonly>
              </div>
              <div class="col-md-3">
                <label class="form-label">Original Value</label>
                <input type="text" class="form-control" formControlName="originalValue" placeholder="Ref Val">
              </div>

              <div class="row mt-3">
                <label class="form-label fw-bold">Evaluation Remarks</label>
                <quill-editor formControlName="remarks" [modules]="quillModules" [readOnly]="isViewMode"
                  placeholder="Enter detailed evaluation remarks..."></quill-editor>
              </div>
              <div class="row mt-3">
                <label class="form-label fw-bold">Trainer Comments</label>
                <quill-editor formControlName="trainerComments" [modules]="quillModules" [readOnly]="isViewMode"
                  placeholder="Enter trainer's final comments..."></quill-editor>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-dark" routerLink="/induction-training">Cancel</button>
          <button type="submit" class="btn navbar-background text-white" [disabled]="trainingForm.invalid">
            <i class="bi bi-save me-1"></i> {{ isEditMode ? 'Update' : 'Save' }} Record
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
