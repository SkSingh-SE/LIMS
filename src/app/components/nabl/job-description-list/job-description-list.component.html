<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <app-nabl-register-table
    [title]="'Job Description'"
    [addButtonLabel]="'Add Job Description'"
    [addRoute]="'/job-description/create'"
    [baseRoute]="'/job-description'"
    [columns]="columns"
    [data]="jobDescriptions"
    [totalItems]="totalItems"
    [isLoading]="false"
    [showSerialNumber]="true"
    [showActions]="true"
    [showPagination]="true"
    (onPageChange)="onPageChange($event)"
    (onDelete)="deleteJobDescription($event)">
  </app-nabl-register-table>
</div>
