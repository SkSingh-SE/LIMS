<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <!-- Main Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">{{ formTitle }}</label>
      <button type="button" class="btn btn-outline-light btn-sm me-3" (click)="onCancel()">
        <i class="bi bi-arrow-left"></i> Back to List
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" [class.ra-form-disabled]="isViewMode">

        <!-- Section I: Header Information -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('header')">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">I. Header Information</span>
          </div>
          <div *ngIf="openSections['header']" class="section-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Format No. <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="formatNo" list="formNumbers" />
                <datalist id="formNumbers">
                  <option *ngFor="let num of formNumbers" [value]="num"></option>
                </datalist>
              </div>
              <div class="col-md-3">
                <label class="form-label">Document No. <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="documentNo" placeholder="DMSPL/..." />
              </div>
              <div class="col-md-2">
                <label class="form-label">Issue No.</label>
                <input type="text" class="form-control bg-light" formControlName="issueNo" readonly />
              </div>
              <div class="col-md-2">
                <label class="form-label">Rev No.</label>
                <input type="text" class="form-control bg-light" formControlName="revNo" readonly />
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Test Method & Scope -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('methodInfo')">
            <i class="bi" [ngClass]="openSections['methodInfo'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">II. Test Method &amp; Scope</span>
          </div>
          <div *ngIf="openSections['methodInfo']" class="section-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Test Method Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="testMethodName" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Scope of Validation <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="scope" placeholder="e.g., Matrix, Range, Application" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Equipment Used <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="equipmentUsed" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Standards / Reagents Used <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="reagentsUsed" />
              </div>
            </div>
          </div>
        </div>

        <!-- Section III: Validation Parameters & Criteria -->
        <div class="accordion-section mb-3">
          <div class="section-header d-flex justify-content-between align-items-center" (click)="toggleSection('parameters')">
            <div>
              <i class="bi" [ngClass]="openSections['parameters'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
              <span class="fw-bold ms-2">III. Validation Parameters &amp; Criteria</span>
            </div>
            <button *ngIf="!isViewMode" type="button" class="btn btn-sm btn-add me-2" (click)="addValidationParameter(); $event.stopPropagation()">
              <i class="bi bi-plus-lg me-1"></i> Add Parameter
            </button>
          </div>
          <div *ngIf="openSections['parameters']" class="section-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle m-0">
                <thead class="bg-light">
                  <tr>
                    <th class="ps-3 py-2 small fw-bold text-muted" style="width: 150px">Parameter</th>
                    <th class="py-2 small fw-bold text-muted">Description / Method</th>
                    <th class="py-2 small fw-bold text-muted">Acceptance Criteria</th>
                    <th class="py-2 small fw-bold text-muted">Observed Value</th>
                    <th class="py-2 small fw-bold text-muted" style="width: 120px">Result</th>
                    <th *ngIf="!isViewMode" class="py-2" style="width: 50px"></th>
                  </tr>
                </thead>
                <tbody formArrayName="validationParameters">
                  <tr *ngFor="let p of validationParameters.controls; let i = index" [formGroupName]="i">
                    <td class="ps-3">
                      <input type="text" class="form-control form-control-sm" formControlName="parameter" placeholder="e.g. Linearity" />
                    </td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="description" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="acceptanceCriteria" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="observedValue" /></td>
                    <td>
                      <select class="form-select form-select-sm" formControlName="result">
                        <option value="Pass">Pass</option>
                        <option value="Fail">Fail</option>
                      </select>
                    </td>
                    <td *ngIf="!isViewMode" class="text-center">
                      <button type="button" class="btn btn-sm text-danger" (click)="removeValidationParameter(i)" [disabled]="validationParameters.length === 1">
                        <i class="bi bi-trash3"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Section IV: Summary of Results & Conclusion -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('results')">
            <i class="bi" [ngClass]="openSections['results'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">IV. Summary of Results &amp; Conclusion</span>
          </div>
          <div *ngIf="openSections['results']" class="section-body">
            <div class="row gap-2">
              <div class="row d-flex">
                <label class="form-label">Summary of Results <span class="text-danger">*</span></label>
                <quill-editor formControlName="summaryOfResults" [modules]="quillModules" [readOnly]="isViewMode"
                  placeholder="Briefly summarize the validation findings..."></quill-editor>
              </div>
              <div class="row d-flex">
                <label class="form-label">Conclusion <span class="text-danger">*</span></label>
                <quill-editor formControlName="conclusion" [modules]="quillModules" [readOnly]="isViewMode"
                  placeholder="State if method is validated and fit for purpose..."></quill-editor>
              </div>
            </div>
          </div>
        </div>

        <!-- Section V: Responsibility & Signatures -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('signatures')">
            <i class="bi" [ngClass]="openSections['signatures'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">V. Responsibility &amp; Signatures</span>
          </div>
          <div *ngIf="openSections['signatures']" class="section-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Prepared By <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="preparedBy" placeholder="Senior Chemist" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Reviewed By <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="reviewedBy" placeholder="Technical Manager" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Approved By <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="approvedBy" placeholder="Quality Manager" />
              </div>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-2 mt-3 mb-2">
          <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-save" [disabled]="requestForm.invalid || isLoading()">
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
