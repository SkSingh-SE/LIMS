<div
  class="register-table-wrapper"
  [class.card]="showCardWrapper"
  [class.basic-data-table]="showCardWrapper"
  [class.w-100]="showCardWrapper"
>
  <!-- Card Header (when showCardWrapper is true) -->
  <div *ngIf="showCardWrapper && title" class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
    <label class="text-md fw-medium ms-3">{{ title }}</label>
    <a *ngIf="addRoute" [routerLink]="addRoute" class="btn btn-outline-light btn-sm me-3">
      <i class="bi bi-plus-lg"></i><span>{{ addButtonLabel }}</span>
    </a>
  </div>

  <div [class.card-body]="showCardWrapper">
    <!-- Search & Controls Bar -->
    <div class="d-flex justify-content-end mb-2 no-print" *ngIf="showPagination">
      <div class="w-25 input-group custom-search">
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Search..."
          [(ngModel)]="searchTerm"
          (keydown.enter)="onSearch()"
        />
        <div class="input-group-text pe-auto cursor-pointer" (click)="onSearch()">
          <i class="bi bi-search"></i>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div *ngIf="data.length > 0 || filters.length > 0" class="table-responsive">
      <table class="table bordered-table align-middle w-100">
        <thead class="table-light text-center align-middle">
          <tr>
            <th *ngIf="showSerialNumber" class="col-sn">SN</th>
            <th *ngFor="let col of columns" [style.width]="col.width || 'auto'">
              <div class="d-flex align-items-center justify-content-center">
                <span class="dt-column-order">{{ col.label }}</span>
                <span class="d-flex flex-column ms-2 mt-2">
                  <i
                    class="bi bi-caret-up sorting-icon-up"
                    [ngClass]="{ 'text-danger': sortByColumn === col.key && sortOrder === 'asc' }"
                    (click)="applySorting(col.key)"
                  ></i>
                  <i
                    class="bi bi-caret-down sorting-icon-down"
                    [ngClass]="{ 'text-danger': sortByColumn === col.key && sortOrder === 'desc' }"
                    (click)="applySorting(col.key)"
                  ></i>
                </span>
                <span *ngIf="!hasFilter(col.key) && col.filter" class="cursor-pointer ms-2 mt-1" (click)="openFilterModal(col.key, $event)">
                  <i class="bi bi-funnel"></i>
                </span>
                <span *ngIf="hasFilter(col.key) && col.filter" class="cursor-pointer ms-1 mt-1" (click)="resetFilter(col.key)">
                  <i class="bi bi-x-lg text-danger"></i>
                </span>
              </div>
            </th>
            <th *ngIf="showActions" class="align-middle text-center no-print" [ngClass]="showWorkflowActions ? 'col-actions-workflow' : 'col-actions-4'">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of data; let i = index" class="text-sm text-center">
            <td *ngIf="showSerialNumber" class="text-center col-sn">{{ getSerialNumber(i) }}</td>
            <td *ngFor="let col of columns" class="align-middle">
              <span *ngIf="col.type === 'date'">{{ row[col.key] | date: "dd MMM, yyyy" }}</span>
              <ng-container *ngIf="col.type !== 'date'">
                <span *ngIf="col.key === 'status' && showWorkflowActions" class="badge" [ngClass]="getStatusBadgeClass(row[col.key])"
                  [class.text-decoration-line-through]="row.isObsolete">
                  {{ row.isObsolete ? 'Obsolete' : row[col.key] }}
                </span>
                <span *ngIf="col.key !== 'status' || !showWorkflowActions">
                  {{ row[col.key] | truncate: 30 }}
                </span>
              </ng-container>
            </td>
            <td *ngIf="showActions" class="text-center no-print" [ngClass]="showWorkflowActions ? 'col-actions-workflow' : 'col-actions-4'">
              <div class="d-flex justify-content-center gap-1 flex-wrap">
                <!-- Route-based navigation when baseRoute is set -->
                <ng-container *ngIf="baseRoute; else eventActions">
                  <!-- View: always available -->
                  <a [routerLink]="[baseRoute + '/details', row.id]" [state]="{ mode: 'view' }" class="btn-lims-icon btn-lims-view" title="View">
                    <i class="bi bi-eye"></i>
                  </a>
                  <!-- Edit: only Draft / Rejected -->
                  <a *ngIf="canEdit(row)" [routerLink]="[baseRoute + '/edit', row.id]" [state]="{ mode: 'edit' }" class="btn-lims-icon btn-lims-edit" title="Edit">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <!-- Print Preview: always available -->
                  <a [routerLink]="[baseRoute + '/preview', row.id]" class="btn-lims-icon btn-lims-print" title="Print Preview">
                    <i class="bi bi-printer"></i>
                  </a>
                  <!-- Delete: only Draft -->
                  <button type="button" *ngIf="canDelete(row)" class="btn-lims-icon btn-lims-delete" title="Delete" (click)="onDelete.emit(row.id)">
                    <i class="bi bi-trash"></i>
                  </button>

                  <!-- Workflow actions -->
                  <ng-container *ngIf="showWorkflowActions && !row.isObsolete">
                    <button type="button" *ngIf="row.status === 'Draft'" class="btn-lims-icon btn-lims-info" title="Submit for Review" (click)="doSubmit(row)">
                      <i class="bi bi-send"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Submitted'" class="btn-lims-icon btn-lims-warning" title="Mark as Reviewed" (click)="doReview(row)">
                      <i class="bi bi-check2-circle"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Reviewed'" class="btn-lims-icon btn-lims-success" title="Approve" (click)="doApprove(row)">
                      <i class="bi bi-check-circle-fill"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Submitted' || row.status === 'Reviewed'" class="btn-lims-icon btn-lims-delete" title="Reject" (click)="doReject(row)">
                      <i class="bi bi-x-circle"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Approved'" class="btn-lims-icon btn-lims-edit" title="Create Revision" (click)="openReviseDialog(row)">
                      <i class="bi bi-arrow-repeat"></i>
                    </button>
                  </ng-container>
                </ng-container>

                <!-- Event-based actions when baseRoute is not set -->
                <ng-template #eventActions>
                  <button type="button" class="btn-lims-icon btn-lims-view" title="View" (click)="onView.emit(row.id)">
                    <i class="bi bi-eye"></i>
                  </button>
                  <button type="button" *ngIf="canEdit(row)" class="btn-lims-icon btn-lims-edit" title="Edit" (click)="onEdit.emit(row.id)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button type="button" class="btn-lims-icon btn-lims-print" title="Preview" (click)="onPreview.emit(row.id)">
                    <i class="bi bi-printer"></i>
                  </button>
                  <button type="button" *ngIf="canDelete(row)" class="btn-lims-icon btn-lims-delete" title="Delete" (click)="onDelete.emit(row.id)">
                    <i class="bi bi-trash"></i>
                  </button>

                  <!-- Workflow actions (event-based) -->
                  <ng-container *ngIf="showWorkflowActions && !row.isObsolete">
                    <button type="button" *ngIf="row.status === 'Draft'" class="btn-lims-icon btn-lims-info" title="Submit for Review" (click)="doSubmit(row)">
                      <i class="bi bi-send"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Submitted'" class="btn-lims-icon btn-lims-warning" title="Mark as Reviewed" (click)="doReview(row)">
                      <i class="bi bi-check2-circle"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Reviewed'" class="btn-lims-icon btn-lims-success" title="Approve" (click)="doApprove(row)">
                      <i class="bi bi-check-circle-fill"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Submitted' || row.status === 'Reviewed'" class="btn-lims-icon btn-lims-delete" title="Reject" (click)="doReject(row)">
                      <i class="bi bi-x-circle"></i>
                    </button>
                    <button type="button" *ngIf="row.status === 'Approved'" class="btn-lims-icon btn-lims-edit" title="Create Revision" (click)="openReviseDialog(row)">
                      <i class="bi bi-arrow-repeat"></i>
                    </button>
                  </ng-container>
                </ng-template>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div *ngIf="data.length === 0 && filters.length === 0" class="w-100 h-100 text-center border rounded-3 mb-2">
      <div class="d-flex flex-column align-items-center justify-content-center text-muted py-4">
        <i class="bi bi-file-earmark-x fs-2 mb-2"></i>
        <div class="fw-semibold">No records found</div>
      </div>
    </div>

    <!-- Pagination -->
    <app-pagination
      [currentPage]="pageNumber"
      [pageSize]="pageSize"
      [totalItems]="totalItems"
      [pageSizes]="pageSizes"
      (pageChange)="changePage($event)"
      (pageSizeChange)="changePageSize($any({ target: { value: $event } }))">
    </app-pagination>
  </div>

  <!-- Revision Dialog -->
  <app-nabl-revision-dialog
    [visible]="showRevisionDialog"
    (onConfirm)="onRevisionConfirm($event)"
    (onCancel)="onRevisionCancel()">
  </app-nabl-revision-dialog>

  <!-- Filter Modal -->
  <div #filterModal class="filter-modal shadow" style="display: none">
    <div class="card py-2 px-3 position-relative border-0">
      <button type="button" class="btn-close btn-sm position-absolute top-0 end-0 m-2" (click)="closeFilterModal()"></button>
      <label class="fw-medium fs-6 mb-2">Filter: {{ filterColumnTitle }}</label>

      <select class="form-select form-select-sm mb-2" [(ngModel)]="filterType">
        <option *ngIf="getColumnType(filterColumn) === 'string'" value="Contains">Contains</option>
        <option *ngIf="getColumnType(filterColumn) === 'string'" value="StartsWith">Starts With</option>
        <option *ngIf="getColumnType(filterColumn) === 'string'" value="EndsWith">Ends With</option>
        <option *ngIf="getColumnType(filterColumn) === 'number'" value="Equal">Equal</option>
        <option *ngIf="getColumnType(filterColumn) === 'number'" value="GreaterThan">Greater Than</option>
        <option *ngIf="getColumnType(filterColumn) === 'number'" value="LessThan">Less Than</option>
        <option *ngIf="getColumnType(filterColumn) === 'date'" value="Between">Between</option>
        <option *ngIf="getColumnType(filterColumn) === 'bool'" value="Equal">Equal</option>
        <option *ngIf="getColumnType(filterColumn) === 'bool'" value="NotEqual">Not Equal</option>
      </select>

      <input
        *ngIf="getColumnType(filterColumn) !== 'date' && getColumnType(filterColumn) !== 'bool'"
        type="text"
        class="form-control form-control-sm mb-2"
        [(ngModel)]="filterValue"
        placeholder="Value"
        (keydown.enter)="applyFilter()"
      />
      <select
        *ngIf="getColumnType(filterColumn) === 'bool'"
        class="form-select form-select-sm mb-2"
        [(ngModel)]="filterValue"
      >
        <option value="">Select...</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
      <input
        *ngIf="getColumnType(filterColumn) === 'date'"
        type="date"
        class="form-control form-control-sm mb-2"
        [(ngModel)]="filterValue"
      />
      <input
        *ngIf="getColumnType(filterColumn) === 'date' && filterType === 'Between'"
        type="date"
        class="form-control form-control-sm mb-2"
        [(ngModel)]="filterValue2"
        placeholder="End date"
      />

      <div class="d-flex gap-1">
        <button class="btn btn-primary btn-sm flex-fill" (click)="applyFilter()">Apply</button>
      </div>
    </div>
  </div>
</div>
