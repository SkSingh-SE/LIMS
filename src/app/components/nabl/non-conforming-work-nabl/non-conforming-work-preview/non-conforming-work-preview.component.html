<div class="preview-toolbar no-print">
  <div class="toolbar-left">
    <button class="toolbar-btn btn-outline-dark" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </button>
  </div>
  <div class="toolbar-center">
    <span class="doc-title-label">
      <i class="bi bi-file-text me-1"></i>
      Non-Conforming Work Preview
    </span>
  </div>
  <div class="toolbar-right">
    <div class="orientation-toggle" title="Page orientation">
      <button class="orient-btn" [class.active]="orientation === 'portrait'" (click)="setOrientation('portrait')">
        <i class="bi bi-file-earmark"></i>
        <span>Portrait</span>
      </button>
      <button class="orient-btn" [class.active]="orientation === 'landscape'" (click)="setOrientation('landscape')">
        <i class="bi bi-file-earmark-text" style="transform:rotate(90deg);display:inline-block;"></i>
        <span>Landscape</span>
      </button>
    </div>
    <button class="toolbar-btn btn-outline-dark" (click)="resetToAuto()" *ngIf="orientationManual" title="Auto-detect">
      <i class="bi bi-arrow-counterclockwise"></i>
      <span>Auto</span>
    </button>
    <button class="toolbar-btn btn-primary-red" (click)="printPage()">
      <i class="bi bi-printer-fill"></i>
      <span>Print</span>
    </button>
  </div>
</div>

<div class="nabl-preview-page">
  <app-print-frame *ngIf="data" [orientation]="orientation">
    <ng-container header>
      <app-nabl-print-header [formatNo]="data.formCode" [mainTitle]="'NON-CONFORMING WORK'"
        [docNo]="'DMSPL / Level-04 / Format / ' + data.formCode" [issueNo]="data.issueNo" [issueDate]="data.date"
        [revNo]="data.revNo" [revDate]="data.date"></app-nabl-print-header>
    </ng-container>

    <ng-container body>
      <!-- Basic Info -->
      <div class="doc-section mb-3">
        <div class="sec-title">NON-CONFERMANCE INFORMATION</div>
        <table class="table table-bordered inner-table">
          <tbody>
            <tr>
              <td class="lbl" style="width: 30%">NON-CONFORMANCE DATE</td>
              <td>{{ data.ncDate | date:'dd.MM.yyyy'}}</td>
              <td class="lbl" style="width: 30%">NON-CONFORMANCE DETAIL</td>
              <td>{{ data.ncDescription }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Non-Conformance Detail -->
      <!-- <div class="doc-section mb-3">
        <div class="sec-title">NON-CONFORMANCE DETAIL</div>
        <div class="sec-body" [innerHTML]="data.ncDescription"></div>
      </div> -->

      <!-- Root Cause Analysis -->
      <div class="doc-section mb-3">
        <div class="sec-title">ROOT CAUSE ANALYSIS</div>
        <div class="sec-body" [innerHTML]="data.rootCauseAnalysis"></div>
      </div>

      <!-- Corrective Action -->
      <div class="doc-section mb-3">
        <div class="sec-title">CORRECTIVE ACTION</div>
        <div class="sec-body" [innerHTML]="data.correctiveAction"></div>
      </div>

      <!-- NC Closer Date -->
      <div class="doc-section mb-3">
        <div class="sec-title">NC CLOSURE</div>
        <table class="table table-bordered inner-table">
          <tbody>
            <tr>
              <td class="lbl" style="width: 30%">NC Closer Date</td>
              <td>{{ data.closerDate | date: "dd.MM.yyyy" }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>

    <ng-container footer>
      <app-nabl-print-footer [preparedByName]="data.preparedBy || ''" [issuedByName]="data.reviewedBy || ''"
        [reviewedApprovedByName]="data.approvedBy || ''"></app-nabl-print-footer>
    </ng-container>
  </app-print-frame>
</div>
