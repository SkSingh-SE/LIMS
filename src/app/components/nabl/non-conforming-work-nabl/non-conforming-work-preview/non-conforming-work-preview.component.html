<div class="preview-toolbar no-print">
  <div class="toolbar-left">
    <button class="toolbar-btn btn-outline-dark" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </button>
  </div>
  <div class="toolbar-center">
    <span class="doc-title-label">
      <i class="bi bi-file-text me-1"></i>
      Non-Conforming Work Preview
    </span>
  </div>
  <div class="toolbar-right">
    <div class="orientation-toggle" title="Page orientation">
      <button class="orient-btn" [class.active]="orientation === 'portrait'"
              (click)="setOrientation('portrait')">
        <i class="bi bi-file-earmark"></i>
        <span>Portrait</span>
      </button>
      <button class="orient-btn" [class.active]="orientation === 'landscape'"
              (click)="setOrientation('landscape')">
        <i class="bi bi-file-earmark-text" style="transform:rotate(90deg);display:inline-block;"></i>
        <span>Landscape</span>
      </button>
    </div>
    <button class="toolbar-btn btn-outline-dark" (click)="resetToAuto()"
            *ngIf="orientationManual" title="Auto-detect">
      <i class="bi bi-arrow-counterclockwise"></i>
      <span>Auto</span>
    </button>
    <button class="toolbar-btn btn-primary-red" (click)="printPage()">
      <i class="bi bi-printer-fill"></i>
      <span>Print</span>
    </button>
  </div>
</div>

<div class="nabl-preview-page">
  <app-print-frame *ngIf="data" [orientation]="orientation">
    <ng-container header>
      <app-nabl-print-header
        [formatNo]="data.formatNo"
        [mainTitle]="'NON-CONFORMING WORK'"
        [docNo]="data.docNo"
        [issueNo]="data.issueNo"
        [issueDate]="data.issueDate"
        [revNo]="data.revNo"
      ></app-nabl-print-header>
    </ng-container>

    <ng-container body>
      <!-- Basic Info -->
      <div class="doc-section mb-3">
        <div class="sec-title">BASIC INFORMATION</div>
        <table class="table table-bordered inner-table">
          <tbody>
            <tr>
              <td class="lbl" style="width: 30%">Date / Month &amp; Year</td>
              <td>{{ data.dateMonthYear }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Non-Conformance Detail -->
      <div class="doc-section mb-3">
        <div class="sec-title">NON-CONFORMANCE DETAIL</div>
        <div class="sec-body" [innerHTML]="data.ncDetail"></div>
      </div>

      <!-- Root Cause Analysis -->
      <div class="doc-section mb-3">
        <div class="sec-title">ROOT CAUSE ANALYSIS</div>
        <div class="sec-body" [innerHTML]="data.rootCauseAnalysis"></div>
      </div>

      <!-- Corrective Action -->
      <div class="doc-section mb-3">
        <div class="sec-title">CORRECTIVE ACTION</div>
        <div class="sec-body" [innerHTML]="data.correctiveAction"></div>
      </div>

      <!-- NC Closer Date -->
      <div class="doc-section mb-3">
        <div class="sec-title">CLOSURE</div>
        <table class="table table-bordered inner-table">
          <tbody>
            <tr>
              <td class="lbl" style="width: 30%">NC Closer Date</td>
              <td>{{ data.closerDate | date: "dd.MM.yyyy" }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>

    <ng-container footer>
      <app-nabl-print-footer
        [showSignatures]="true"
        [preparedByName]="'TD/QM'"
        [preparedByRole]="'Signature Of TD/QM'"
      ></app-nabl-print-footer>
    </ng-container>
  </app-print-frame>
</div>
