<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg border-0">
    <!-- Premium Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center">
        <i class="bi bi-clipboard-check-fill fs-4 me-2"></i>
        <header class="text-md fw-medium">{{ formTitle }}</header>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-light btn-sm px-3" (click)="onCancel()">
          <i class="bi bi-arrow-left me-1"></i> Back to List
        </button>
      </div>
    </div>

    <div class="card-body p-4">
      <div *ngIf="false" class="text-center py-5">
        <div class="spinner-border " role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <form [formGroup]="inspectionForm" (ngSubmit)="onSubmit()" [class.ra-form-disabled]="inspectionForm.disabled">

        <!-- Section I: Header Information -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('header')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">I. Document Control Information</span>
          </div>
          <div *ngIf="openSections['header']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Form Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="formatNo" list="formNumbers" placeholder="e.g. F-23">
                <datalist id="formNumbers">
                  <option *ngFor="let form of formNumbers" [value]="form"></option>
                </datalist>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Issue No <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" formControlName="issueNo" readonly placeholder="Auto">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Rev No <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" formControlName="revNo" readonly placeholder="Auto">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control bg-light" formControlName="date" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Inspection Plan Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="documentNo" placeholder="DMSPL-IP-YYYY-XXX">
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Product Details -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('product')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['product'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">II. Product / Service Details</span>
          </div>
          <div *ngIf="openSections['product']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Product / Service Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="productName">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Product / Service Code <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="productCode">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Category <span class="text-danger">*</span></label>
                <select class="form-select shadow-sm" formControlName="category">
                    <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold text-dark small">Inspection Stage <span class="text-danger">*</span></label>
                <select class="form-select shadow-sm" formControlName="inspectionStage">
                    <option *ngFor="let s of stages" [value]="s">{{ s }}</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Section III: Inspection Parameters -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('parameters')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['parameters'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">III. Inspection Parameters</span>
          </div>
          <div *ngIf="openSections['parameters']" class="section-body p-0 border border-top-0 rounded-bottom">
            <div class="table-responsive">
              <table class="table table-bordered align-middle sm-table mb-0">
                <thead class="table-light align-middle text-center">
                  <tr>
                    <th style="width: 50px;">SN</th>
                    <th>Parameter Name <span class="text-danger">*</span></th>
                    <th>Requirement <span class="text-danger">*</span></th>
                    <th>Method of Check <span class="text-danger">*</span></th>
                    <th>Frequency <span class="text-danger">*</span></th>
                    <th>Acceptance Criteria <span class="text-danger">*</span></th>
                    <th style="width: 50px;" *ngIf="!isViewMode"></th>
                  </tr>
                </thead>
                <tbody formArrayName="parameters">
                  <tr *ngFor="let param of parameters.controls; let i = index" [formGroupName]="i">
                    <td class="text-center fw-bold text-secondary">{{ i + 1 }}</td>
                    <td>
                      <textarea class="form-control form-control-sm border-dashed" formControlName="parameterName" rows="2"></textarea>
                    </td>
                    <td>
                      <textarea class="form-control form-control-sm border-dashed" formControlName="requirement" rows="2"></textarea>
                    </td>
                    <td>
                      <input type="text" class="form-control form-control-sm border-dashed" formControlName="methodOfCheck">
                    </td>
                    <td>
                      <input type="text" class="form-control form-control-sm border-dashed" formControlName="frequency">
                    </td>
                    <td>
                      <textarea class="form-control form-control-sm border-dashed" formControlName="acceptanceCriteria" rows="2"></textarea>
                    </td>
                    <td *ngIf="!isViewMode" class="text-center">
                      <button type="button" class="btn btn-remove btn-sm border-0" (click)="removeParameter(i)" [disabled]="parameters.length <= 1">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="p-2 bg-light border-top" *ngIf="!isViewMode">
              <button type="button" class="btn btn-add btn-sm px-3" (click)="addParameter()">
                <i class="bi bi-plus-circle me-1"></i> Add More Parameter
              </button>
            </div>
          </div>
        </div>

        <!-- Section IV: Signatories & Remarks -->
        <div class="accordion-section mb-4">
          <div class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top" (click)="toggleSection('signatories')" style="cursor: pointer;">
            <i class="bi" [ngClass]="openSections['signatories'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">IV. Signatories & Remarks</span>
          </div>
          <div *ngIf="openSections['signatories']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-12 d-flex flex-column">
                <label class="form-label fw-semibold text-dark small">General Remarks</label>
                <quill-editor formControlName="remarks" [modules]="quillModules" placeholder="Enter special instructions or remarks..."></quill-editor>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">Prepared By <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="preparedBy">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">Reviewed By <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="reviewedBy">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">Approved By <span class="text-danger">*</span></label>
                <input type="text" class="form-control shadow-sm" formControlName="approvedBy">
              </div>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-light px-4 fw-semibold border shadow-sm" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-save px-4 fw-semibold shadow-sm" [disabled]="inspectionForm.invalid">
            <i class="bi bi-check2-circle me-1"></i> {{ isEditMode ? 'Update' : 'Save' }} Inspection Plan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
