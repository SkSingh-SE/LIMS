<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <!-- Main Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">{{ formTitle }}</label>
      <button type="button" class="btn btn-outline-light btn-sm me-3" (click)="onCancel()">
        <i class="bi bi-arrow-left"></i> Back to List
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" [class.ra-form-disabled]="isViewMode">

        <!-- Section I: Header Information -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('header')">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">I. Header Information</span>
          </div>
          <div *ngIf="openSections['header']" class="section-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Format No. <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="formatNo" list="formNumbers" />
                <datalist id="formNumbers">
                  <option *ngFor="let num of formNumbers" [value]="num"></option>
                </datalist>
              </div>
              <div class="col-md-3">
                <label class="form-label">Document No. <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="documentNo" placeholder="DMSPL/..." />
              </div>
              <div class="col-md-2">
                <label class="form-label">Issue No.</label>
                <input type="text" class="form-control bg-light" formControlName="issueNo" readonly />
              </div>
              <div class="col-md-2">
                <label class="form-label">Rev No.</label>
                <input type="text" class="form-control bg-light" formControlName="revNo" readonly />
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Sample Muster Entries -->
        <div class="accordion-section mb-3">
          <div class="section-header d-flex justify-content-between align-items-center" (click)="toggleSection('entries')">
            <div>
              <i class="bi" [ngClass]="openSections['entries'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
              <span class="fw-bold ms-2">II. Sample Muster Entries</span>
            </div>
            <button *ngIf="!isViewMode" type="button" class="btn btn-sm btn-add me-2" (click)="addEntry(); $event.stopPropagation()">
              <i class="bi bi-plus-lg me-1"></i> Add Entry
            </button>
          </div>
          <div *ngIf="openSections['entries']" class="section-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle m-0" style="min-width: 1200px">
                <thead class="bg-light">
                  <tr>
                    <th class="ps-3 py-2 small fw-bold text-muted" style="width: 50px">Sr.</th>
                    <th class="py-2 small fw-bold text-muted" style="width: 130px">Sample ID</th>
                    <th class="py-2 small fw-bold text-muted" style="width: 130px">Receipt Date</th>
                    <th class="py-2 small fw-bold text-muted">Description</th>
                    <th class="py-2 small fw-bold text-muted">Test Required</th>
                    <th class="py-2 small fw-bold text-muted">Analyst</th>
                    <th class="py-2 small fw-bold text-muted" style="width: 130px">Started</th>
                    <th class="py-2 small fw-bold text-muted" style="width: 130px">Completed</th>
                    <th class="py-2 small fw-bold text-muted" style="width: 120px">Status</th>
                    <th *ngIf="!isViewMode" class="py-2" style="width: 50px"></th>
                  </tr>
                </thead>
                <tbody formArrayName="entries">
                  <tr *ngFor="let entry of entries.controls; let i = index" [formGroupName]="i">
                    <td class="ps-3 text-center small fw-bold">{{ entry.get('srNo')?.value }}</td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="sampleId" placeholder="S-..." /></td>
                    <td><input type="date" class="form-control form-control-sm" formControlName="receiptDate" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="description" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="testParameters" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="analystName" /></td>
                    <td><input type="date" class="form-control form-control-sm" formControlName="analysisStartDate" /></td>
                    <td><input type="date" class="form-control form-control-sm" formControlName="analysisEndDate" /></td>
                    <td>
                      <select class="form-select form-select-sm" formControlName="status">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                      </select>
                    </td>
                    <td *ngIf="!isViewMode" class="text-center">
                      <button type="button" class="btn btn-sm text-danger" (click)="removeEntry(i)" [disabled]="entries.length === 1">
                        <i class="bi bi-trash3"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <app-nabl-signature-section [parentForm]="requestForm"></app-nabl-signature-section>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-2 mt-3 mb-2">
          <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-save" [disabled]="requestForm.invalid || false">
            {{ isEditMode ? 'Update' : 'Save' }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
