<div class="container-fluid mt-4">
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <app-nabl-register-table
        [title]="'F-26: Supplier Evaluation Records'"
        [data]="records"
        [columns]="columns"
        [totalItems]="totalRecords"
        [isLoading]="false"
        [baseRoute]="'/supplier-evaluation'"
        [addRoute]="'/supplier-evaluation/create'"
        (onPageChange)="loadRecords($event)"
        (onDelete)="onDelete($event)"
      ></app-nabl-register-table>
    </div>
  </div>
</div>
