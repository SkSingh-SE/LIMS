<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <!-- Main Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">{{ formTitle }}</label>
      <button type="button" class="btn btn-outline-light btn-sm me-3" (click)="onCancel()">
        <i class="bi bi-arrow-left"></i>
        Back to List
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="reportForm" (ngSubmit)="onSubmit()" [class.ra-form-disabled]="isViewMode">
        <!-- Section I: Header Information -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('header')">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">I. Header Information</span>
            <div class="ms-auto pe-3 text-muted small">Format Details</div>
          </div>
          <div *ngIf="openSections['header']" class="section-body">
            <div class="row gy-3">
              <div class="col-md-3">
                <label class="form-label">
                  Form Number
                  <span class="text-danger">*</span>
                </label>
                <select class="form-select" formControlName="formatNo">
                  <option value="" disabled>Select Form</option>
                  <option *ngFor="let form of formNumbers" [value]="form">{{ form }}</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  Document No.
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control fw-bold" formControlName="documentNo" placeholder="TR-0001" />
              </div>
              <div class="col-md-2">
                <label class="form-label">
                  Issue No
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="issueNo" placeholder="e.g. 01" />
              </div>
              <div class="col-md-2">
                <label class="form-label">
                  Date of Issue
                  <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" formControlName="dateOfIssue" />
              </div>
              <div class="col-md-2">
                <label class="form-label">
                  Rev No
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="revNo" placeholder="e.g. 00" />
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Customer Information -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('customerInfo')">
            <i class="bi" [ngClass]="openSections['customerInfo'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">II. Customer Information</span>
          </div>
          <div *ngIf="openSections['customerInfo']" class="section-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">
                  Customer Name
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="customerName" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Customer Reference (PO/Project)</label>
                <input type="text" class="form-control" formControlName="customerReference" />
              </div>
              <div class="col-12">
                <label class="form-label">
                  Customer Address
                  <span class="text-danger">*</span>
                </label>
                <textarea class="form-control" formControlName="customerAddress" rows="2"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Section III: Sample & Test Information -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('sampleInfo')">
            <i class="bi" [ngClass]="openSections['sampleInfo'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">III. Sample & Test Information</span>
          </div>
          <div *ngIf="openSections['sampleInfo']" class="section-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">
                  Sample Description
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="sampleDescription" />
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  Sample ID / TRN
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="sampleId" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Quantity</label>
                <input type="text" class="form-control" formControlName="quantity" />
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  Condition on Receipt
                  <span class="text-danger">*</span>
                </label>
                <select class="form-select" formControlName="conditionOnReceipt">
                  <option value="Satisfactory">Satisfactory</option>
                  <option value="Damaged">Damaged</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Heat No / Batch No</label>
                <input type="text" class="form-control" formControlName="heatNoBatchNo" />
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  Date of Receipt
                  <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" formControlName="dateOfReceipt" />
              </div>
              <div class="col-md-3">
                <label class="form-label">
                  Date of Testing
                  <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" formControlName="dateOfTesting" />
              </div>
              <div class="col-12">
                <label class="form-label">Environmental Conditions</label>
                <input type="text" class="form-control" formControlName="environmentalConditions" />
              </div>
            </div>
          </div>
        </div>

        <!-- Section IV: Test Results -->
        <div class="accordion-section mb-3">
          <div class="section-header d-flex justify-content-between align-items-center" (click)="toggleSection('results')">
            <div>
              <i class="bi" [ngClass]="openSections['results'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
              <span class="fw-bold ms-2">IV. Test Results</span>
            </div>
            <button
              *ngIf="!isViewMode"
              type="button"
              class="btn btn-sm btn-light py-0 me-3"
              (click)="addResult(); $event.stopPropagation()"
            >
              <i class="bi bi-plus-lg me-1"></i>
              Add Result
            </button>
          </div>
          <div *ngIf="openSections['results']" class="section-body p-0">
            <div class="table-responsive m-0">
              <table class="table table-bordered mb-0 small">
                <thead class="bg-light">
                  <tr>
                    <th class="ps-3 py-2 fw-bold text-muted" style="width: 50px">S.N.</th>
                    <th class="py-2 fw-bold text-muted">Test Parameter</th>
                    <th class="py-2 fw-bold text-muted">Test Method</th>
                    <th class="py-2 fw-bold text-muted">Requirement</th>
                    <th class="py-2 fw-bold text-muted">Result</th>
                    <th class="py-2 fw-bold text-muted">Unit</th>
                    <th *ngIf="!isViewMode" class="py-2 fw-bold text-muted text-center" style="width: 50px"></th>
                  </tr>
                </thead>
                <tbody formArrayName="results">
                  <tr *ngFor="let res of results.controls; let i = index" [formGroupName]="i">
                    <td class="ps-3 text-center">{{ i + 1 }}</td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="testParameter" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="testMethod" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="requirement" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="result" /></td>
                    <td><input type="text" class="form-control form-control-sm" formControlName="unit" /></td>
                    <td *ngIf="!isViewMode" class="text-center">
                      <button type="button" class="btn btn-sm text-danger" (click)="removeResult(i)" [disabled]="results.length === 1">
                        <i class="bi bi-trash3"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Section V: Approval & Conclusion -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('approval')">
            <i class="bi" [ngClass]="openSections['approval'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">V. Approval & Conclusion</span>
          </div>
          <div *ngIf="openSections['approval']" class="section-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Statement of Conformity</label>
                <select class="form-select" formControlName="statementOfConformity">
                  <option value="Conforming">Conforming to Requirements</option>
                  <option value="Non-Conforming">Non-Conforming to Requirements</option>
                  <option value="Not Applicable">Not Applicable</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">
                  Prepared By
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="preparedBy" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Reviewed By</label>
                <input type="text" class="form-control" formControlName="reviewedBy" />
              </div>
              <div class="col-md-6">
                <label class="form-label">
                  Approved By
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="approvedBy" placeholder="Authorized Signatory" />
              </div>
              <div class="col-12 mt-3">
                <label class="form-label fw-bold">Remarks / Disclaimer</label>
                <quill-editor
                  formControlName="remarks"
                  [modules]="quillModules"
                  [readOnly]="isViewMode"
                  placeholder="Enter any remarks, limitations or disclaimers..."
                ></quill-editor>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-2 mt-3 mb-2">
          <button type="button" class="btn btn-dark" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn navbar-background text-white" [disabled]="reportForm.invalid || isLoading()">
            {{ isEditMode ? "Update Record" : "Save Record" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
