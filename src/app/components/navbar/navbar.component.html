<nav #navbar class="navbar-expand-lg fixed-top border-bottom shadow-sm">
  <div class="d-flex w-100 nav-content navbar-background">
    <!-- Logo -->
    <div class="w-auto border-end bg-white px-2">
      <a class="navbar-brand d-flex align-items-center py-2 px-3" href="#">
        <img src="LIMS.png" alt="Logo" width="50" height="40" />
      </a>
    </div>
    <div class="flex-grow-1 d-flex align-items-center">
      <!-- Menu Section -->
      <div #menuContainer class="menu-container d-flex mx-2">
        <div
          *ngFor="let menu of visibleMenuItems; let i = index"
          #menuItem
          class="menu-item header-font"
          (click)="openSubMenu(menu)"
          [ngClass]="{ active: activeMenu() === menu.title }"
        >
          <div class="d-flex gap-2 align-items-center">
            <i class="bi" [class]="menu.icon"></i>
            <span class="">{{ menu.title }}</span>
          </div>
        </div>
      </div>
    </div>
    <!-- Right Section -->
    <div #navRight class="d-flex align-items-center gap-2 me-2">
      <!-- Menu Search -->
      <div class="menu-search-wrapper" [class.expanded]="isSearchExpanded()">
        <input
          #searchInput
          type="text"
          class="menu-search-input"
          placeholder="Search menu... (Ctrl+K)"
          [(ngModel)]="searchQuery"
          (input)="onSearchInput()"
          (blur)="closeSearch()"
          [class.visible]="isSearchExpanded()"
        />
        <button class="btn btn-light rounded-circle h-auto menu-search-btn" (click)="toggleSearch()">
          <i class="bi bi-search"></i>
        </button>
        <div class="menu-search-results" *ngIf="isSearchOpen() && searchResults.length > 0">
          <div
            *ngFor="let item of searchResults"
            class="menu-search-result-item"
            (mousedown)="navigateToSearch(item)"
          >
            <div class="result-title">{{ item.title }}</div>
            <div class="result-breadcrumb">{{ item.breadcrumb }}</div>
          </div>
        </div>
      </div>
      <!-- Down Arrow Icon -->
      <button class="btn btn-light rounded-circle h-auto" data-bs-toggle="collapse" (click)="menuOpenClose()">
        <i class="bi" [ngClass]="{ 'rotate-up bi-chevron-up': !isMenu2Open(), 'rotate-down bi-chevron-down': isMenu2Open() }"></i>
      </button>

      <app-notification-bell></app-notification-bell>
      <!-- User Profile Dropdown -->
      <div class="me-2">
        <button
          class="btn position-relative rounded-circle h-auto border-0 p-0"
          type="button"
          id="userDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <img src="user-avatar.png" alt="Logo" width="40" height="40" />
        </button>
        <ul class="dropdown-menu dropdown-menu-end mt-2 p-2 shadow" aria-labelledby="userDropdown">
          <li><a class="dropdown-item" href="#">Profile</a></li>
          <li><a class="dropdown-item" routerLink="/settings">Settings</a></li>
          <li>
            <hr class="dropdown-divider" />
          </li>
          <li><a class="dropdown-item btn" (click)="logout()">Logout</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- menu2: rendered when overflow available -->
  <div class="collapse w-100" [ngClass]="{ show: isMenu2Open() }" id="menu2" *ngIf="menu2Items && menu2Items.length > 0">
    <div class="menu2-outer d-flex align-items-center bg-theme">
      <button class="btn btn-sm menu2-scroll-btn" (click)="scrollMenu2('left')">
        <i class="bi bi-chevron-left text-white"></i>
      </button>
      <div #menu2Scroll class="card card-body menu2-container d-flex flex-row gap-2 align-items-center justify-content-start bg-theme">
        <div
          *ngFor="let menu of menu2Items"
          class="menu2-item header-font"
          (click)="openSubMenu(menu)"
          [ngClass]="{ active: activeMenu() === menu.title }"
        >
          <div class="d-flex gap-2 align-items-center">
            <i class="bi" [class]="menu.icon"></i>
            <span class="">{{ menu.title }}</span>
          </div>
        </div>
      </div>
      <button class="btn btn-sm menu2-scroll-btn" (click)="scrollMenu2('right')">
        <i class="bi bi-chevron-right text-white"></i>
      </button>
    </div>
  </div>

  <!-- submenu: show when subMenus signal has items and submenu open -->
  <div class="card card-body flex-row submenu-container" *ngIf="subMenus().length > 0 && isSubMenuOpen()" (mouseleave)="closeSubMenu()">
    <div
      *ngFor="let subMenuItem of subMenus()"
      class="submenu-item"
      (click)="setActiveSubMenu(subMenuItem)"
      (mouseenter)="onSubmenuEnter(subMenuItem.id)"
      (mouseleave)="onSubmenuLeave()"
      [ngClass]="{ active: activeSubmenu() === subMenuItem.title }"
    >
      <ng-container *ngIf="subMenuItem.children && subMenuItem.children.length > 0; else leafLink">
        <div class="dropdown">
          <span class="submenu-label dropdown-toggle">{{ subMenuItem.title }}</span>
          <ul class="dropdown-menu"
              [class.show]="hoveredSubmenuId() === subMenuItem.id"
              (mouseenter)="onDropdownEnter(subMenuItem.id)"
              (mouseleave)="onDropdownLeave()">
            <ng-container *ngFor="let nestedSubMenu of subMenuItem.children">
              <!-- Group with children: fly-out panel -->
              <ng-container *ngIf="nestedSubMenu.children && nestedSubMenu.children.length > 0; else singleNestedItem">
                <li class="dropdown-submenu"
                    [ngClass]="{ 'active-group': activeNestedItemId() === nestedSubMenu.id }"
                    (mouseenter)="onGroupEnter(nestedSubMenu.id)"
                    (mouseleave)="onGroupLeave()">
                  <a class="has-submenu">{{ nestedSubMenu.title }}</a>
                  <ul class="dropdown-menu submenu-panel"
                      [class.show]="hoveredGroupId() === nestedSubMenu.id"
                      (mouseenter)="onGroupEnter(nestedSubMenu.id)"
                      (mouseleave)="onGroupLeave()">
                    <li *ngFor="let deepItem of nestedSubMenu.children"
                        [ngClass]="{ 'active-deep': activeDeepItemId() === deepItem.id }">
                      <a [routerLink]="deepItem.route"
                         (click)="setActiveDeepItem(deepItem, nestedSubMenu.id)">{{ deepItem.title }}</a>
                    </li>
                  </ul>
                </li>
              </ng-container>
              <!-- Leaf: direct link -->
              <ng-template #singleNestedItem>
                <li [ngClass]="{ 'active-nested': activeNestedItemId() === nestedSubMenu.id }">
                  <a [routerLink]="nestedSubMenu.route"
                     (click)="setActiveNestedItem(nestedSubMenu)">{{ nestedSubMenu.title }}</a>
                </li>
              </ng-template>
            </ng-container>
          </ul>
        </div>
      </ng-container>
      <ng-template #leafLink>
        <a [routerLink]="subMenuItem.route" class="submenu-label">{{ subMenuItem.title }}</a>
      </ng-template>
    </div>
  </div>
</nav>
