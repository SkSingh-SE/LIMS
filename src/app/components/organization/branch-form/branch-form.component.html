<div class="modal-backdrop fade show" *ngIf="visible"></div>

<div class="modal fade show d-block" tabindex="-1" role="dialog" *ngIf="visible">
  <div class="modal-dialog modal-md modal-dialog-centered" role="document">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header bg-light py-2 px-3 border-bottom">
        <h6 class="modal-title fw-semibold text-dark mb-0 d-flex align-items-center">
          <i class="bi bi-geo-alt-fill text-danger me-2"></i>
          {{ isEditMode ? 'Edit Branch' : 'Add New Branch' }}
        </h6>
        <button type="button" class="btn-close btn-sm" aria-label="Close" (click)="onClose()"></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="modal-body p-3">
          <div class="row g-2">
            <!-- Branch Name -->
            <div class="col-md-7">
              <label class="form-label">
                Branch Name <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control form-control-sm" formControlName="name" placeholder="e.g. Pune Central Lab">
              <div *ngIf="form.get('name')?.touched && form.get('name')?.invalid" class="text-danger form-error-msg">
                Branch name is required.
              </div>
            </div>

            <!-- Branch Code -->
            <div class="col-md-5">
              <label class="form-label">
                Branch Code <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control form-control-sm font-monospace" formControlName="code" placeholder="e.g. BR-PUN-01">
              <div *ngIf="form.get('code')?.touched && form.get('code')?.invalid" class="text-danger form-error-msg">
                Branch code is required.
              </div>
            </div>

            <!-- Head Office Switch -->
            <div class="col-md-12">
              <div class="form-check form-switch py-1">
                <input class="form-check-input" type="checkbox" id="headOfficeCheck" formControlName="isHeadOffice">
                <label class="form-check-label form-label-sm text-dark ms-1" for="headOfficeCheck">
                  <strong>Designate as Head Office</strong> (Only one active Head Office per organization)
                </label>
              </div>
            </div>

            <!-- Branch Address -->
            <div class="col-md-12">
              <label class="form-label">Branch Physical Address</label>
              <textarea class="form-control form-control-sm" rows="2" formControlName="address" placeholder="Physical location / laboratory building address"></textarea>
            </div>

            <!-- Contact Email -->
            <div class="col-md-6">
              <label class="form-label">Branch Email</label>
              <input type="email" class="form-control form-control-sm" formControlName="contactEmail" placeholder="branch@example.com">
            </div>

            <!-- Contact Phone -->
            <div class="col-md-6">
              <label class="form-label">Branch Phone / Extension</label>
              <input type="text" class="form-control form-control-sm" formControlName="contactPhone" placeholder="+91 20 12345678">
            </div>
          </div>
        </div>

        <div class="modal-footer bg-light py-2 px-3 border-top">
          <button type="button" class="btn btn-lims btn-lims-cancel btn-sm" (click)="onClose()" [disabled]="isSubmitting">
            <i class="bi bi-x-circle me-1"></i> Cancel
          </button>
          <button type="submit" class="btn btn-lims btn-lims-save btn-sm" [disabled]="isSubmitting">
            <i class="bi bi-check-circle me-1"></i> {{ isEditMode ? 'Update Branch' : 'Create Branch' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
