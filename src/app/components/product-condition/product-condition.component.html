<div class="container-fluid mt-4 d-flex flex-column align-items-center">
    <div class="card basic-data-table w-100">
        <div
            class="card-header card-form-header text-white text-center d-flex justify-content-between align-items-center">
            <label class="text-center text-md fw-medium ms-3">Product Condition List</label>
            <a class="btn btn-outline-light me-3" (click)="openModal('create',0)">
                <i class="bi bi-plus-lg"></i> Create Product Condition
            </a>
        </div>

        <div class="card-body">
            <!-- Search -->
            <div class="d-flex justify-content-end mb-2">
                <div class="w-25 input-group custom-search">
                    <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchTerm"
                        (keydown.enter)="onSearch()">
                    <div class="input-group-text pe-auto" (click)="onSearch()">
                        <i class="bi bi-search"></i>
                    </div>
                </div>
            </div>


            <div *ngIf="ProductConditionList.length > 0 || filters.length > 0" class="table-responsive ">
                <table class="table bordered-table  align-middle w-100">
                    <thead class="table-light">
                        <tr class="text-center align-middle">
                            <th class="align-middle text-center" style="width: 130px; min-width: 130px;">Actions</th>
                            <th *ngFor="let column of columns; let i = index">
                                <div class="d-flex align-items-center">
                                    <span class="dt-column-order">{{ column.label }}</span>
                                    <span class="d-flex flex-column ms-2 mt-2">
                                        <i class="bi bi-caret-up sorting-icon-up"
                                            [ngClass]="{'text-danger': sortByColumn === column.key && sortOrder === 'asc'}"
                                            (click)="applySorting(column.key)"></i>
                                        <i class="bi bi-caret-down sorting-icon-down"
                                            [ngClass]="{'text-danger': sortByColumn === column.key && sortOrder === 'desc'}"
                                            (click)="applySorting(column.key)"></i>
                                    </span>
                                    <span *ngIf="!hasFilter(column.key) && column.filter" class="cursor ms-2 mt-1"
                                        (click)="openFilterModal(column.key, $event)"><i
                                            class="bi bi-funnel"></i></span>
                                    <span *ngIf="hasFilter(column.key) && column.filter" class="cursor ms-1 mt-1"
                                        (click)="resetFilter(column.key)"><i class="bi bi-x-lg text-danger"></i></span>
                                </div>
                            </th>
                        </tr>


                    </thead>
                    <tbody>
                        <tr *ngFor="let customerType of ProductConditionList; let i = index" class="text-sm">

                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-3"> <!-- Flex for spacing -->
                                    <a (click)="openModal('view',customerType.id)" class="icon-link" title="View">
                                        <img src="/icons/view.svg" alt="View" class="icon-svg">
                                    </a>
                                    <a (click)="openModal('edit',customerType.id)" class="icon-link" title="Edit">
                                        <img src="/icons/edit.svg" alt="Edit" class="icon-svg">
                                    </a>
                                    <a (click)="deleteFn(customerType.id)" class="icon-link" title="Delete">
                                        <img src="/icons/delete.svg" alt="Delete" class="icon-svg">
                                    </a>
                                </div>
                            </td>


                            <td>{{ (pageNumber - 1) * pageSize + i + 1 }}</td>
                            <td><a class="text-primary fw-medium cursor-pointer" (click)="openModal('view', customerType.id)">{{ customerType.code }}</a></td>
                            <td>{{ customerType.name }}</td>
                            <td>{{ customerType.modifiedOn | date:"dd MMM, yyyy hh:mm a" }}</td>                        </tr>
                    </tbody>
                </table>


            </div>
            <div *ngIf="ProductConditionList.length == 0" class="w-100 h-100 text-center border rounded-3 mb-2">
                <div class="d-flex flex-column align-items-center justify-content-center text-muted py-4">
                    <i class="bi bi-file-earmark-x fs-2 mb-2"></i>
                    <div class="fw-semibold">No records found</div>

                </div>
            </div>
            <!-- Pagination -->
            <!-- Pagination -->
            <app-pagination
              [currentPage]="pageNumber"
              [pageSize]="pageSize"
              [totalItems]="totalItems"
              [pageSizes]="pageSizes"
              (pageChange)="onPageChange($event)"
              (pageSizeChange)="changePageSize($any({ target: { value: $event } }))">
            </app-pagination>


        </div>
    </div>
</div>

<!-- Filter Modal -->
<div #filterModal class="filter-modal">
    <div class="card py-2 px-3 shadow position-relative">
        <!-- Close Button in the Top-Right Corner -->
        <button type="button" class="btn-close btn-sm position-absolute top-0 end-0 m-2"
            (click)="closeFilterModal()"></button>

        <label class="fw-medium fs-6 mb-2">Filter: {{ filterColumnTitle | titlecase }}</label>

        <select class="form-select mb-2" [(ngModel)]="filterType">
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] === 'string'" value="Contains">Contains
            </option>
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] === 'date'" value="Between">Between</option>
            <option value="Equal">Equal</option>
            <option value="NotEqual">Not Equal</option>
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] !== 'string'" value="GreaterThan">Greater
                Than</option>
            <option *ngIf="filterColumn && filterColumnTypes[filterColumn] !== 'string'" value="LessThan">Less Than
            </option>
        </select>

        <input *ngIf="filterColumnTypes[filterColumn!] === 'string'" type="text" class="form-control mb-2"
            [(ngModel)]="filterValue" placeholder="Enter value" (keydown.enter)="applyFilter()" />
        <input *ngIf="filterColumnTypes[filterColumn] === 'number'" type="number" class="form-control mb-2"
            [(ngModel)]="filterValue" placeholder="Enter number" (keydown.enter)="applyFilter()" />
        <input *ngIf="filterColumnTypes[filterColumn] === 'date' && filterType !== 'Between'" type="date"
            class="form-control mb-2" [(ngModel)]="filterValue" />
        <div *ngIf="filterType === 'Between'" class="d-flex flex-column gap-2">
            <input type="date" class="form-control mb-2" [(ngModel)]="filterValue" placeholder="Start date" />
            <input type="date" class="form-control mb-2" [(ngModel)]="filterValue2" placeholder="End date" />
        </div>

        <button class="btn btn-primary btn-sm mb-2" (click)="applyFilter()">Apply</button>
    </div>
</div>

<!-- Modal for Add/Edit/Update Product Condition -->
<div id="customerTypeModal" class="modal fade modal-fade" #modalRef tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
    aria-labelledby="customerTypeModalLabel" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header card-form-header text-white">
                <label class="modal-title fw-medium" id="customerTypeModalLabel">
                    {{formTitle}}
                </label>
                <button type="button" class="btn-close btn-close-white" aria-label="Close"
                    (click)="closeModal()"></button>
            </div>
            <form [formGroup]="ProductConditionForm" (ngSubmit)="onSubmit()">
                <div class="modal-body">
                    <div class="row">
                        <!-- Code Field -->
                        <div class="col-md-6 mb-1">
                            <label for="code" class="form-label">Code <span class="text-danger">*</span></label>
                            <input type="text" id="code" class="form-control" formControlName="code"
                                placeholder="Enter Code" maxlength="50"
                                [ngClass]="{'is-invalid': isFieldInvalid('code')}"
                                [attr.disabled]="isViewMode ? true : null" />
                            <app-field-error [control]="ProductConditionForm.get('code')" label="Code" [submitted]="submitted"/>
                        </div>
                        <!-- Name Field -->
                        <div class="col-md-6 mb-1">
                            <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" class="form-control" formControlName="name"
                                placeholder="Enter Name" maxlength="200"
                                [ngClass]="{'is-invalid': isFieldInvalid('name')}"
                                [attr.disabled]="isViewMode ? true : null" />
                            <app-field-error [control]="ProductConditionForm.get('name')" label="Name" [submitted]="submitted"/>
                        </div>
                    </div>
                    <div class="row">
                        <!-- Category Dropdown -->
                        <div class="col-md-6 mb-1">
                            <div class="d-flex align-items-start gap-1">
                                <div class="flex-grow-1">
                                    <app-searchable-dropdown
                                        [fetchDataFn]="getCategoryDropdown"
                                        [selectedItem]="ProductConditionForm.get('productConditionCategoryID')?.value"
                                        (itemSelected)="ProductConditionForm.get('productConditionCategoryID')?.setValue($event?.id)"
                                        [placeholder]="'Select Category'"
                                        [labelName]="'Category'"
                                        [isDisabled]="isViewMode">
                                    </app-searchable-dropdown>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm mt-1"
                                    (click)="openLinkedMaster('/product-condition-category')"
                                    title="Open Category" *ngIf="!isViewMode">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>
                        <!-- Linked Heat Treatment Dropdown -->
                        <div class="col-md-6 mb-1">
                            <div class="d-flex align-items-start gap-1">
                                <div class="flex-grow-1">
                                    <app-searchable-dropdown
                                        [fetchDataFn]="getHeatTreatmentDropdown"
                                        [selectedItem]="ProductConditionForm.get('linkedHeatTreatmentID')?.value"
                                        (itemSelected)="ProductConditionForm.get('linkedHeatTreatmentID')?.setValue($event?.id)"
                                        [placeholder]="'Select Heat Treatment'"
                                        [labelName]="'Linked Heat Treatment'"
                                        [isDisabled]="isViewMode">
                                    </app-searchable-dropdown>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm mt-1"
                                    (click)="openLinkedMaster('/heat-treatment')"
                                    title="Open Heat Treatment" *ngIf="!isViewMode">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <!-- Calibration Required Checkbox -->
                        <div class="col-md-6 mb-1">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="calibrationRequired"
                                    formControlName="calibrationRequired"
                                    [attr.disabled]="isViewMode ? true : null" />
                                <label class="form-check-label" for="calibrationRequired">Calibration Required</label>
                            </div>
                        </div>
                        <!-- Is Destructive Checkbox -->
                        <div class="col-md-6 mb-1">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="isDestructive"
                                    formControlName="isDestructive"
                                    [attr.disabled]="isViewMode ? true : null" />
                                <label class="form-check-label" for="isDestructive">Is Destructive</label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <!-- Properties Captured Multi-Select -->
                        <div class="col-md-12 mb-1">
                            <div class="d-flex align-items-start gap-1">
                                <div class="flex-grow-1">
                                    <app-multi-select-dropdown
                                        [placeholder]="'Select Properties...'"
                                        [labelName]="'Properties Captured'"
                                        [fetchDataFn]="getPropertyTypeDropdown"
                                        [selectedValues]="ProductConditionForm.get('propertiesCapturedIds')?.value"
                                        (itemsSelected)="onPropertySelected($event)"
                                        [isDisabled]="isViewMode">
                                    </app-multi-select-dropdown>
                                </div>
                                <button type="button" class="btn btn-outline-primary btn-sm mt-1"
                                    (click)="openLinkedMaster('/property-type')"
                                    title="Open Property Type" *ngIf="!isViewMode">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Modal Footer -->
                <div *ngIf="!isViewMode" class="modal-footer">
                    <button type="button" class="btn btn-cancel" (click)="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-save">
                        {{ isEditMode ? 'Update' : 'Save' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
