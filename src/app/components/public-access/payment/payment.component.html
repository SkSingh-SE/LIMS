<main class="min-vh-100 d-flex align-items-center justify-content-center bg-white px-3">
  <section class="w-100" style="max-width: 440px;">

    <!-- Loading State -->
    <div *ngIf="loading" class="text-center">
      <div
        class="spinner-border"
        role="status"
        aria-hidden="true"
        style="color:#6c757d"
      ></div>
      <p class="mt-3 text-muted">Validating payment link...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="!loading && error" class="alert alert-danger text-center" role="alert">
      {{ error }}
    </div>

    <!-- Success State -->
    <div *ngIf="!loading && success" class="card border shadow-sm text-center">
      <div class="card-body py-5">
        <div class="fs-1 mb-3 text-success" aria-hidden="true">✔</div>
        <h4 class="mb-2">Payment Successful</h4>
        <p class="text-muted mb-0">
          Your payment has been received.<br />
          You may close this window.
        </p>
      </div>
    </div>

    <!-- Payment Details (Reactive Form) -->
    <form
      *ngIf="!loading && !error && !success"
      [formGroup]="paymentForm"
      class="card border shadow-sm"
      novalidate
    >
      <div class="card-body">

        <h5 class="text-center mb-4">Payment Details</h5>

        <div class="mb-3">
          <label class="form-label text-muted">Customer</label>
          <input
            type="text"
            class="form-control bg-light"
            formControlName="customerName"
          />
        </div>

        <div class="mb-3">
          <label class="form-label text-muted">Order No</label>
          <input
            type="text"
            class="form-control bg-light"
            formControlName="orderNo"
          />
        </div>

        <div class="mb-3">
          <label class="form-label text-muted">Payment Type</label>
          <input
            type="text"
            class="form-control bg-light"
            [value]="getPaymentTypeDisplay()"
            readonly
          />
        </div>

        <div class="mb-4">
          <label class="form-label text-muted">Amount (₹)</label>
          <input
            type="number"
            class="form-control bg-light fw-semibold"
            formControlName="amount"
          />
        </div>

        <button
          type="button"
          class="btn w-100"
          style="background:#495057;color:#fff"
          (click)="payNow()"
          aria-label="Pay Now"
        >
          Pay Now
        </button>

      </div>
    </form>

  </section>
</main>
