<div class="rtb-container d-flex">
  <div class="palette p-2">
    <div class="card shadow-sm p-2">
      <h6 class="mb-2">Palette</h6>
      <div *ngFor="let g of palette" class="mb-2">
        <div class="small text-muted">{{g.group}}</div>
        <div class="d-flex flex-column">
          <div *ngFor="let p of g.items" class="palette-item btn btn-sm btn-cancel mb-1" cdkDrag [cdkDragData]="p">{{p.label}}</div>
        </div>
      </div>
      <hr />
      <div class="btn-group mt-2 w-100">
        <button class="btn btn-sm btn-danger w-50" (click)="undo()">Undo</button>
        <button class="btn btn-sm btn-danger w-50" (click)="redo()">Redo</button>
      </div>
    </div>
  </div>

  <div class="canvas flex-fill p-2">
    <div class="card shadow-sm p-2 canvas-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <input class="form-control form-control-sm" [(ngModel)]="template.templateName" placeholder="Template name" />
        </div>
        <div class="btn-group">
          <div class="btn-group me-2">
            <button class="btn btn-sm btn-cancel" [class.active]="!livePreview" (click)="livePreview=false">Builder Mode</button>
            <button class="btn btn-sm btn-cancel" [class.active]="livePreview" (click)="livePreview=true">Preview Mode</button>
          </div>
          <button class="btn btn-sm btn-save" (click)="saveTemplate()">Save</button>
          <button class="btn btn-sm btn-danger" (click)="exportJson()">Export</button>
          <label class="btn btn-sm btn-cancel mb-0">
            Import <input type="file" hidden (change)="handleImport($event)" />
          </label>
        </div>
      </div>
      <div *ngIf="!livePreview">
        <div cdkDropList class="sections-list" [cdkDropListData]="template.components" (cdkDropListDropped)="sectionDrop($event)">
          <div *ngFor="let c of template.components; let i = index; trackBy: trackByComp" cdkDrag class="mb-2">
            <rtb-component-node [component]="c" [selectedId]="selectedComponent?.id" (select)="selectComponent($event)" (drop)="handleDrop($event)"></rtb-component-node>
          </div>
        </div>
        <div class="mt-3">
          <small class="text-muted">Drag components from the left palette into the canvas. Use rows/columns for layout.</small>
        </div>
      </div>
      <div *ngIf="livePreview">
        <div class="preview-form">
          <form>
            <ng-container *ngFor="let c of template.components">
              <div class="mb-2">
                <label *ngIf="c.label">{{c.label}}</label>
                <ng-container [ngSwitch]="c.type">
                  <input *ngSwitchCase="'text'" class="form-control form-control-sm" [placeholder]="c.placeholder || ''" [readonly]="c.hidden || c.readonly" />
                  <input *ngSwitchCase="'number'" type="number" class="form-control form-control-sm" [readonly]="c.hidden || c.readonly" />
                  <textarea *ngSwitchCase="'textarea'" class="form-control form-control-sm" [readonly]="c.hidden || c.readonly"></textarea>
                  <input *ngSwitchCase="'date'" type="date" class="form-control form-control-sm" />
                  <select *ngSwitchCase="'dropdown'" class="form-control form-control-sm">
                    <option *ngFor="let o of c.options">{{o.label}}</option>
                  </select>
                  <div *ngSwitchCase="'checkbox'" class="form-check"><input type="checkbox" class="form-check-input" /> <label class="form-check-label">{{c.label}}</label></div>
                </ng-container>
              </div>
            </ng-container>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="properties p-2">
    <div class="card shadow-sm p-2">
      <h6 class="mb-2">Properties</h6>
      <ng-template #propertyHost></ng-template>
      <div *ngIf="!selectedComponent" class="text-muted small">Select a component to edit properties.</div>
    </div>

    <div class="card shadow-sm mt-2 p-2">
      <h6 class="mb-2">Preview JSON</h6>
      <pre class="json-preview small">{{template | json}}</pre>
    </div>
  </div>
</div>
