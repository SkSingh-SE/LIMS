<div class="container-fluid">
  <div class="card basic-data-table w-100 border-0 shadow-sm">
    <div class="card-header card-form-header text-white text-center d-flex justify-content-between align-items-center">
      <label class="text-center text-md fw-medium ms-3">
        <i class="bi bi-file-text"></i>
        Amend Report
      </label>
      <button class="btn btn-sm btn-light fw-semibold" routerLink="/reporting/dashboard">
        <i class="bi bi-arrow-left"></i>
        Back
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="amendForm" (ngSubmit)="submit()">

        <!-- Amendment Type -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            Amendment Type <span class="text-danger">*</span>
          </label>
          <select 
            class="form-select" 
            formControlName="amendmentType"
          >
            <option *ngFor="let option of amendmentTypeOptions" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
          <div class="form-text">
            <i class="bi bi-info-circle"></i>
            {{ getAmendmentTypeLabel() }}
          </div>
          <div *ngIf="isTypeDeterminedByBackend" class="alert alert-info mt-2 mb-0">
            <small>Amendment type is determined by the system based on the request source.</small>
          </div>
        </div>

        <!-- Amendment Reason -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            Amendment Reason <span class="text-danger">*</span>
          </label>
          <textarea
            rows="4"
            class="form-control"
            formControlName="reason"
            placeholder="Enter reason for amendment"
          ></textarea>
          <div *ngIf="f['reason'].touched && f['reason'].invalid" class="text-danger small">
            <div *ngIf="f['reason'].errors?.['required']">Reason is required</div>
            <div *ngIf="f['reason'].errors?.['minlength']">
              Minimum 10 characters required
            </div>
          </div>
        </div>

        <!-- Supporting Document -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            Supporting Document <span class="text-danger">*</span>
          </label>
          <input
            type="file"
            class="form-control"
            (change)="onFileChange($event)"
            accept=".pdf,.doc,.docx,.jpg,.png"
          />
          <div *ngIf="f['file'].touched && f['file'].invalid" class="text-danger small">
            Supporting document is required
          </div>
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-end gap-2">
          <button
            type="button"
            class="btn btn-cancel btn-sm"
            (click)="cancel()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-danger btn-sm fw-semibold"
            [disabled]="isSubmitting"
          >
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
            Submit Amendment
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
