<div class="container-fluid d-flex flex-column align-items-center">
  <div class="card basic-data-table w-100">
    <div class="card-header card-form-header text-white text-center d-flex justify-content-between align-items-center">
      <label class="text-center text-md fw-medium ms-3">Reporting Dashboard</label>
    </div>

    <div class="card-body">
      <!-- Search -->
      <div class="d-flex justify-content-end mb-3">
        <div class="w-25 input-group custom-search">
          <input type="text" class="form-control" placeholder="Search..."
            [(ngModel)]="searchTerm" (keydown.enter)="onSearch()" />
          <div class="input-group-text pe-auto" (click)="onSearch()">
            <i class="bi bi-search"></i>
          </div>
        </div>
      </div>

      <!-- Table View -->
      <div *ngIf="filteredData.length > 0" class="table-responsive">
        <table class="table bordered-table align-middle w-100 small">
          <thead class="table-light">
            <tr class="text-center align-middle">
              <th *ngFor="let column of columns; let i = index" class="fw-semibold">
                <div class="d-flex align-items-center justify-content-center">
                  <span class="dt-column-order">{{ column.label }}</span>
                  <span class="d-flex flex-column ms-2 mt-1">
                    <i
                      *ngIf="column.filter"
                      class="bi bi-caret-up sorting-icon-up"
                      [ngClass]="{ 'text-danger': sortByColumn === column.key && sortOrder === 'asc' }"
                      (click)="applySorting(column.key)"
                    ></i>
                    <i
                      *ngIf="column.filter"
                      class="bi bi-caret-down sorting-icon-down"
                      [ngClass]="{ 'text-danger': sortByColumn === column.key && sortOrder === 'desc' }"
                      (click)="applySorting(column.key)"
                    ></i>
                  </span>
                  <span
                    *ngIf="!hasFilter(column.key) && column.filter"
                    class="cursor ms-2 mt-1"
                    (click)="openFilterModal(column.key, $event)"
                  >
                    <i class="bi bi-funnel"></i>
                  </span>
                  <span *ngIf="hasFilter(column.key) && column.filter" class="cursor ms-1 mt-1" (click)="resetFilter(column.key)">
                    <i class="bi bi-x-lg text-danger"></i>
                  </span>
                </div>
              </th>
              <th class="align-middle text-center fw-semibold">Pricing</th>
              <th class="align-middle text-center fw-semibold" style="width: 130px; min-width: 130px;">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of filteredData" class="align-middle text-center">
              <td class="fw-semibold">
                <a
                  [routerLink]="['/reporting/preview', item.sampleId || item.reportHeaderId]"
                  class="text-primary text-decoration-none cursor-pointer"
                  [title]="'View details for ' + item.sampleNo">
                  {{ item.sampleNo }}
                </a>
              </td>
              <td class="fw-semibold">
                <a
                  [routerLink]="['/sample/inward/details', item.inwardId]"
                  [state]="{ mode: 'view' }"
                  class="text-primary text-decoration-none cursor-pointer"
                  [title]="'View inward for ' + item.caseNo">
                  {{ item.caseNo }}
                </a>
              </td>
              <td>
                <a *ngIf="item.customerID"
                   [routerLink]="['/customer/details', item.customerID]"
                   [state]="{ mode: 'view' }"
                   class="text-primary text-decoration-none cursor-pointer"
                   [title]="'View customer: ' + item.customer">
                  {{ item.customer }}
                </a>
                <span *ngIf="!item.customerID">{{ item.customer }}</span>
              </td>
              <td>{{ item.material || '-' }}</td>
              <td>{{ item.condition || '-' }}</td>
              <td class="text-center">
                <app-test-status-badge [status]="item.status"></app-test-status-badge>
              </td>
              <td class="text-end">
                <span *ngIf="canViewPricing(item)" class="text-muted small">
                  <i class="bi bi-currency-rupee"></i>{{ getItemPrice(item) }}
                </span>
                <span *ngIf="!canViewPricing(item)" class="text-muted small">-</span>
              </td>
              <td>
                <div class="d-flex gap-1 justify-content-center flex-nowrap">
                  <!-- Preview -->
                  <button class="btn btn-sm btn-outline-info"
                    [routerLink]="['/reporting/preview', item.sampleId || item.reportHeaderId]" title="Preview Report">
                    <i class="bi bi-eye"></i>
                  </button>

                  <!-- PDF -->
                  <button *ngIf="item.reportHeaderId"
                    class="btn btn-sm btn-outline-danger"
                    title="Generate PDF"
                    (click)="generatePdf(item, $event)"
                    [disabled]="pdfGeneratingId === item.reportHeaderId">
                    <i *ngIf="pdfGeneratingId !== item.reportHeaderId" class="bi bi-file-pdf"></i>
                    <span *ngIf="pdfGeneratingId === item.reportHeaderId" class="spinner-border spinner-border-sm"></span>
                  </button>

                  <!-- Amend -->
                  <button *ngIf="canAmend(item.status)"
                    class="btn btn-sm btn-outline-warning" title="Amend Report"
                    (click)="openAmendment(item)">
                    <i class="bi bi-pencil-square"></i>
                  </button>

                  <!-- Workflow Actions -->
                  <ng-container *ngIf="item.canTakeAction && item.actions">
                    <button *ngFor="let action of item.actions" class="btn btn-sm"
                      [ngClass]="{
                        'btn-outline-success': action.action.toLowerCase().includes('next'),
                        'btn-outline-danger': action.action.toLowerCase().includes('cancel'),
                        'btn-outline-secondary': action.action.toLowerCase().includes('back')
                      }"
                      [title]="action.name"
                      (click)="performWorkflowAction(item, action.action)">
                      <i class="bi"
                        [class.bi-check-circle]="action.action.toLowerCase().includes('next')"
                        [class.bi-arrow-return-left]="action.action.toLowerCase().includes('back')"
                        [class.bi-x-circle]="action.action.toLowerCase().includes('cancel')"></i>
                    </button>
                  </ng-container>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div *ngIf="filteredData.length === 0" class="alert alert-light border border-secondary text-center py-4">
        <i class="bi bi-info-circle text-secondary"></i>
        <p class="mb-0 text-secondary">No records found matching your criteria.</p>
      </div>

      <!-- Pagination -->
      <!-- Pagination -->
      <app-pagination
        [currentPage]="pageNumber"
        [pageSize]="pageSize"
        [totalItems]="totalItems"
        [pageSizes]="pageSizes"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="changePageSize($any({ target: { value: $event } }))">
      </app-pagination>
    </div>

    <!-- Loading State -->
    <div *ngIf="false" class="card-body text-center py-4">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>
</div>
<!-- Filter Modal -->
<div #filterModal class="filter-modal">
  <div class="card py-2 px-3 shadow position-relative border-0">
    <!-- Close Button in the Top-Right Corner -->
    <button type="button" class="btn-close btn-sm position-absolute top-0 end-0 m-2" (click)="closeFilterModal()"></button>

    <label class="fw-medium fs-6 mb-2">Filter: {{ filterColumnTitle | titlecase }}</label>

    <select class="form-select mb-2 border-secondary" [(ngModel)]="filterType">
      <option *ngIf="getColumnType(filterColumn) === 'string'" value="Contains">Contains</option>
      <option *ngIf="getColumnType(filterColumn) === 'date'" value="Between">Between</option>
      <option value="Equal">Equal</option>
      <option value="NotEqual">Not Equal</option>
      <option *ngIf="getColumnType(filterColumn) !== 'string'" value="GreaterThan">Greater Than</option>
      <option *ngIf="getColumnType(filterColumn) !== 'string'" value="LessThan">Less Than</option>
    </select>

    <input
      *ngIf="filterColumnTypes[filterColumn!] === 'string'"
      type="text"
      class="form-control mb-2 border-secondary"
      [(ngModel)]="filterValue"
      placeholder="Enter value"
      (keydown.enter)="applyFilter()"
    />
    <input
      *ngIf="filterColumnTypes[filterColumn] === 'number'"
      type="number"
      class="form-control mb-2 border-secondary"
      [(ngModel)]="filterValue"
      placeholder="Enter number"
      (keydown.enter)="applyFilter()"
    />
    <input
      *ngIf="filterColumnTypes[filterColumn] === 'date' && filterType !== 'Between'"
      type="date"
      class="form-control mb-2 border-secondary"
      [(ngModel)]="filterValue"
    />
    <div *ngIf="filterType === 'Between'" class="d-flex flex-column gap-2">
      <input type="date" class="form-control mb-2 border-secondary" [(ngModel)]="filterValue" placeholder="Start date" />
      <input type="date" class="form-control mb-2 border-secondary" [(ngModel)]="filterValue2" placeholder="End date" />
    </div>

    <button class="btn btn-danger btn-sm mb-2 fw-semibold" (click)="applyFilter()">Apply</button>
  </div>
</div>
