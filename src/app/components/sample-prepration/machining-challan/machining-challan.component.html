<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">Machining Charges</label>
    </div>

    <div class="card-body">

      <!-- Selection Row: Case & Sample Dropdowns -->
      <div class="row gy-3 mb-4">
        <div class="col-md-5">
          <app-searchable-dropdown
            [labelName]="'Collection No.'"
            [fetchDataFn]="fetchSampleInwardDropdown"
            placeholder="Search Collection No."
            [required]="true"
            [isDisabled]="false"
            (itemSelected)="onInwardSelected($event)"
            [selectedItem]="selectedInwardId"
          ></app-searchable-dropdown>
        </div>
        <div class="col-md-5">
          <app-searchable-dropdown
            [labelName]="'Sample'"
            [fetchDataFn]="fetchSampleDropdown"
            placeholder="Search Sample..."
            [required]="true"
            [isDisabled]="!selectedInwardId || !availableSamples.length"
            (itemSelected)="onSampleSelected($event)"
            [selectedItem]="selectedSampleId"
          ></app-searchable-dropdown>
        </div>
      </div>

      <!-- No samples alert -->
      <div *ngIf="selectedInwardId && !availableSamples.length" class="alert alert-warning py-2 mb-3">
        <i class="bi bi-exclamation-triangle me-1"></i> No samples found for this case.
      </div>

      <!-- Loading Spinner -->
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-muted small">Loading machining charges...</div>
      </div>

      <!-- Machining Charges Content -->
      <div *ngIf="!loading && selectedSampleId">

        <!-- Charges Table -->
        <div class="table-responsive">
          <table class="table bordered-table align-middle w-100 mb-3">
            <thead class="table-light">
              <tr class="text-center align-middle">
                <th style="width: 50px">#</th>
                <th class="text-start">Description</th>
                <th class="text-end" style="width: 150px">Amount (&#8377;)</th>
                <th class="text-start">Remark</th>
                <th style="width: 80px">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of machiningItems; let i = index" class="text-sm">
                <td class="text-center">{{ i + 1 }}</td>
                <td>{{ item.description }}</td>
                <td class="text-end fw-medium">{{ item.amount | number:'1.2-2' }}</td>
                <td class="text-muted">{{ item.remark || '-' }}</td>
                <td class="text-center">
                  <button class="btn btn-sm btn-remove" (click)="deleteItem(item.id)" title="Delete">
                    <i class="bi bi-trash3"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="!machiningItems.length">
                <td colspan="5" class="text-center py-4">
                  <div class="d-flex flex-column align-items-center text-muted">
                    <i class="bi bi-file-earmark-x fs-2 mb-2"></i>
                    <div class="fw-semibold">No machining charges recorded for this sample.</div>
                  </div>
                </td>
              </tr>
            </tbody>
            <tfoot *ngIf="machiningItems.length">
              <tr class="table-light">
                <td colspan="2" class="text-end fw-bold">Grand Total</td>
                <td class="text-end fw-bold text-danger">&#8377; {{ totalAmount | number:'1.2-2' }}</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        </div>

        <!-- Add New Charge Section -->
        <div class="card border shadow-sm mt-3">
          <div class="card-body">
            <div class="d-flex align-items-center mb-3">
              <i class="bi bi-plus-circle-dotted fs-5 me-2 text-primary"></i>
              <label class="fw-bold mb-0">Add Machining Charge</label>
            </div>
            <div class="row g-3 align-items-end">
              <div class="col-md-4">
                <label class="form-label">Description <span class="text-danger">*</span></label>
                <input type="text" class="form-control" [(ngModel)]="newDesc" placeholder="e.g. Surface Grinding" />
              </div>
              <div class="col-md-2">
                <label class="form-label">Amount (&#8377;) <span class="text-danger">*</span></label>
                <input type="number" class="form-control text-end" [(ngModel)]="newAmount" placeholder="0.00" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Remark</label>
                <input type="text" class="form-control" [(ngModel)]="newRemark" placeholder="Optional" />
              </div>
              <div class="col-md-2">
                <button class="btn btn-save w-100" (click)="addItem()" [disabled]="!newDesc || !newAmount">
                  <i class="bi bi-plus-lg me-1"></i>Add
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
