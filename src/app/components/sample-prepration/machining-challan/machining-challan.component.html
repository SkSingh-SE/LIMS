<div class="card shadow-lg m-2">
  <div class="card-header card-form-header text-white text-center">
    <h6 class="mb-0">Machining Charges</h6>
  </div>
  <div class="card-body">

    <!-- Sample ID Lookup -->
    <div class="row mb-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label fw-bold">Sample ID</label>
        <input type="number" class="form-control" [(ngModel)]="sampleId" placeholder="Enter Sample ID" />
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary" (click)="loadItems()" [disabled]="!sampleId || loading">
          <i class="bi bi-search me-1"></i>Load
        </button>
      </div>
    </div>

    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
      <span class="ms-2">Loading...</span>
    </div>

    <!-- Machining Items Table -->
    <div *ngIf="!loading && sampleId">
      <table class="table table-bordered table-sm align-middle mb-3">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Description</th>
            <th class="text-end" style="width: 140px;">Amount (&#8377;)</th>
            <th>Remark</th>
            <th style="width: 70px;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of machiningItems; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ item.description }}</td>
            <td class="text-end">{{ item.amount | number:'1.2-2' }}</td>
            <td class="text-muted small">{{ item.remark || '-' }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-danger" (click)="deleteItem(item.id)" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!machiningItems.length">
            <td colspan="5" class="text-center text-muted py-3">No machining charges recorded for this sample.</td>
          </tr>
        </tbody>
        <tfoot *ngIf="machiningItems.length">
          <tr class="table-light fw-bold">
            <td colspan="2" class="text-end">Total</td>
            <td class="text-end">&#8377;{{ totalAmount | number:'1.2-2' }}</td>
            <td colspan="2"></td>
          </tr>
        </tfoot>
      </table>

      <!-- Add New Item -->
      <div class="card border-dashed p-3">
        <h6 class="fw-bold mb-2"><i class="bi bi-plus-circle me-1"></i>Add Machining Charge</h6>
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label small">Description</label>
            <input type="text" class="form-control form-control-sm" [(ngModel)]="newDesc" placeholder="e.g. Surface Grinding" />
          </div>
          <div class="col-md-2">
            <label class="form-label small">Amount (&#8377;)</label>
            <input type="number" class="form-control form-control-sm text-end" [(ngModel)]="newAmount" placeholder="0.00" />
          </div>
          <div class="col-md-3">
            <label class="form-label small">Remark</label>
            <input type="text" class="form-control form-control-sm" [(ngModel)]="newRemark" placeholder="Optional" />
          </div>
          <div class="col-md-2">
            <button class="btn btn-sm btn-success w-100" (click)="addItem()" [disabled]="!newDesc || !newAmount">
              <i class="bi bi-plus-lg me-1"></i>Add
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
