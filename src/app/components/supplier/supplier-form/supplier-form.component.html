<div class="card shadow-lg m-2">
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
        <label class="text-md fw-medium ms-3">{{ isViewMode ? 'View Supplier' : (isEditMode ? 'Edit Supplier' : 'Supplier Form') }}</label>
        <a routerLink="/supplier" class="btn btn-outline-light btn-sm me-3">
            <i class="bi bi-arrow-left"></i><span>Back to List</span>
        </a>
    </div>
    <div class="card-body">
        <form [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
            <div class="row row-cols-sm-2 row-cols-md-3 row-cols-lg-3 g-2">

                <!--Name-->
                <div>
                    <label class="form-label">Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="name" placeholder="Enter Name"
                        maxlength="100"
                        [ngClass]="{ 'is-invalid': isFieldInvalid('name') }" />
                    <app-field-error [control]="supplierForm.get('name')" label="Name" [submitted]="submitted"/>
                </div>
                <!--Product Type-->
                <div>
                    <label class="form-label">Product Type <span class="text-danger">*</span></label>
                        <select class="form-control form-select" formControlName="productType"
                        [ngClass]="{ 'is-invalid': supplierForm.get('productType')?.touched && supplierForm.get('productType')?.invalid }">
                        <option value="Product" [defaultSelected]="true">Product </option>
                        <option value="Equipment / OEM">Equipment / OEM</option>
                        <option value="Service Supplied">Service Supplied</option>
                    </select>
                    <div *ngIf="supplierForm.get('productType')?.touched && supplierForm.get('productType')?.invalid"
                        class="text-danger text-sm">Product Type is required.</div>
                </div>
                <!--Address-->
                <div>
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" formControlName="address" placeholder="Enter Address" maxlength="100" />
                </div>
                <!--Contact Person 1-->
                <div>
                    <label class="form-label">Contact Person 1</label>
                    <input type="text" class="form-control" formControlName="contactPerson1"
                        placeholder="Enter Contact Person 1" maxlength="100"
                        [ngClass]="{ 'is-invalid': isFieldInvalid('contactPerson1') }" />
                    <app-field-error [control]="supplierForm.get('contactPerson1')" label="Contact Person 1" [submitted]="submitted"/>
                </div>
                <!--Contact No 1-->
                <div>
                    <label class="form-label">Contact No 1</label>
                    <app-phone-input formControlName="contactNo1" [submitted]="submitted"></app-phone-input>
                </div>

                <!--Email Id 1-->
                <div>
                    <label class="form-label">Email Id 1</label>
                    <div class="input-with-icon-wrapper">
                        <input type="email" class="form-control" formControlName="emailId1" placeholder="e.g. contact@supplier.com"
                            maxlength="100"
                            [ngClass]="{ 'is-invalid': isFieldInvalid('emailId1') }" />
                        <span class="input-trailing-icon">
                            <i class="bi bi-envelope"></i>
                        </span>
                    </div>
                    <app-field-error [control]="supplierForm.get('emailId1')" label="Email Id 1" [submitted]="submitted"/>
                </div>

                <!--Contact Person 2-->
                <div>
                    <label class="form-label">Contact Person 2</label>
                    <input type="text" class="form-control" formControlName="contactPerson2"
                        placeholder="Enter Contact Person 2" maxlength="100"
                        [ngClass]="{ 'is-invalid': isFieldInvalid('contactPerson2') }" />
                    <app-field-error [control]="supplierForm.get('contactPerson2')" label="Contact Person 2" [submitted]="submitted"/>
                </div>

                <!--Contact No 2-->
                <div>
                    <label class="form-label">Contact No 2</label>
                    <app-phone-input formControlName="contactNo2" [submitted]="submitted"></app-phone-input>
                </div>

                <!--Email Id 2-->
                <div>
                    <label class="form-label">Email Id 2</label>
                    <div class="input-with-icon-wrapper">
                        <input type="email" class="form-control" formControlName="emailId2" placeholder="e.g. contact@supplier.com"
                            maxlength="100"
                            [ngClass]="{ 'is-invalid': isFieldInvalid('emailId2') }" />
                        <span class="input-trailing-icon">
                            <i class="bi bi-envelope"></i>
                        </span>
                    </div>
                    <app-field-error [control]="supplierForm.get('emailId2')" label="Email Id 2" [submitted]="submitted"/>
                </div>

                <!--Contact Person 3-->
                <div>
                    <label class="form-label">Contact Person 3</label>
                    <input type="text" class="form-control" formControlName="contactPerson3"
                        placeholder="Enter Contact Person 3" maxlength="100"
                        [ngClass]="{ 'is-invalid': isFieldInvalid('contactPerson3') }" />
                    <app-field-error [control]="supplierForm.get('contactPerson3')" label="Contact Person 3" [submitted]="submitted"/>
                </div>

                <!--Contact No 3-->
                <div>
                    <label class="form-label">Contact No 3</label>
                    <app-phone-input formControlName="contactNo3" [submitted]="submitted"></app-phone-input>
                </div>

                <!--Email Id 3-->
                <div>
                    <label class="form-label">Email Id 3</label>
                    <div class="input-with-icon-wrapper">
                        <input type="email" class="form-control" formControlName="emailId3" placeholder="e.g. contact@supplier.com"
                            maxlength="100"
                            [ngClass]="{ 'is-invalid': isFieldInvalid('emailId3') }" />
                        <span class="input-trailing-icon">
                            <i class="bi bi-envelope"></i>
                        </span>
                    </div>
                    <app-field-error [control]="supplierForm.get('emailId3')" label="Email Id 3" [submitted]="submitted"/>
                </div>

                <!--Present Status-->
                <div>
                    <label class="form-label">Present Status <span class="text-danger">*</span></label>
                    <select class="form-control form-select" formControlName="presentStatus"
                        [ngClass]="{ 'is-invalid': supplierForm.get('presentStatus')?.touched && supplierForm.get('presentStatus')?.invalid }">
                        <option value="1">Enlisted</option>
                        <option value="2">Delisted</option>
                    </select>
                    <div *ngIf="supplierForm.get('presentStatus')?.touched && supplierForm.get('presentStatus')?.invalid"
                        class="text-danger text-sm">Present Status is required.</div>
                </div>

                <!--Agreement File Path-->
                <div>
                    <label class="form-label">Agreement File </label>
                    <ng-container *ngIf="supplierForm.get('agreementFilePath')?.value || supplierForm.get('fileName')?.value; else uploadField">
                        <div class="d-flex align-items-center justify-content-between bg-light border rounded file-preview-box">
                            <span class="text-truncate me-2" type="button"
                                (click)="openFileInNewTab(supplierForm.get('agreementFilePath')?.value)"
                                title="{{ supplierForm.get('agreementFilePath')?.value }}">
                                <i class="bi bi-file-earmark-fill me-1"></i><span>{{supplierForm.get('fileName')?.value }}</span>
                            </span>
                            <button *ngIf="!isViewMode" type="button" class="btn btn-sm btn-link text-danger p-0"
                                (click)="removeFile()">
                                <i class="bi bi-trash-fill fs-6 me-1"></i>
                            </button>
                        </div>
                    </ng-container>

                    <ng-template #uploadField>
                        <input class="form-control input-file" type="file"
                             accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"
                            [disabled]="isViewMode" (change)="onFileChange($event)" />
                    </ng-template>
                </div>

                <div>
                    <label class="form-label">Blacklist Date</label>
                    <input type="date" class="form-control" formControlName="blacklistDate" />
                </div>


            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a [routerLink]="['/supplier']" class="btn-lims btn-lims-cancel">
                    <i class="bi bi-x-circle me-1"></i><span>Cancel</span>
                </a>
                <button *ngIf="!isViewMode" type="submit" class="btn-lims btn-lims-save" [disabled]="supplierForm.invalid">
                    <i class="bi bi-check-circle me-1"></i><span>{{ isEditMode ? "Update" : "Save" }}</span>
                </button>
            </div>

        </form>
    </div>
</div>
