<div>
  <div class="d-flex justify-content-between align-items-center mb-1">
    <span class="small text-muted">Sub-Types</span>
    <button type="button" *ngIf="!isViewMode" class="btn btn-sm btn-outline-primary py-0 px-2" (click)="startAdd()">
      <i class="bi bi-plus-circle me-1"></i>Add
    </button>
  </div>

  <!-- Add new row -->
  <div *ngIf="editRowId === -1" class="border rounded p-2 mb-2 bg-light" [formGroup]="editForm">
    <div class="row g-1 align-items-end">
      <div class="col-3">
        <label class="form-label small mb-0">Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control form-control-sm" formControlName="name"
          [ngClass]="{ 'is-invalid': editForm.get('name')?.touched && editForm.get('name')?.invalid }" />
        <div *ngIf="editForm.get('name')?.touched && editForm.get('name')?.invalid" class="text-danger text-sm">Name is required.</div>
      </div>
      <div class="col-2">
        <app-searchable-dropdown
          [placeholder]="'Technique'"
          [labelName]="'Technique'"
          [fetchDataFn]="getTechniques"
          [smallInput]="true"
          (itemSelected)="editForm.patchValue({ analysisTechniqueID: $event?.id || null })"
        ></app-searchable-dropdown>
      </div>
      <div class="col-2">
        <label class="form-label small mb-0">Pricing Rule</label>
        <input type="text" class="form-control form-control-sm" formControlName="pricingRuleType" placeholder="e.g. FLAT" />
      </div>
      <div class="col-3">
        <label class="form-label small mb-0">Invoice Caption</label>
        <input type="text" class="form-control form-control-sm" formControlName="invoiceCaption" />
      </div>
      <div class="col-2 d-flex gap-1">
        <button type="button" class="btn btn-sm btn-success" (click)="saveNew()"><i class="bi bi-check-lg"></i></button>
        <button type="button" class="btn btn-sm btn-secondary" (click)="cancelEdit()"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>
  </div>

  <table class="table table-sm table-bordered mb-0">
    <thead class="table-light">
      <tr>
        <th>Name</th>
        <th>Technique</th>
        <th>Pricing Rule</th>
        <th>Invoice Caption</th>
        <th *ngIf="!isViewMode" style="width:80px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="subTypes.length === 0 && editRowId !== -1">
        <td colspan="5" class="text-muted text-center small py-1">No sub-types.</td>
      </tr>
      <ng-container *ngFor="let st of subTypes">
        <tr *ngIf="editRowId === st.id" [formGroup]="editForm">
          <td>
            <input type="text" class="form-control form-control-sm" formControlName="name"
              [ngClass]="{ 'is-invalid': editForm.get('name')?.touched && editForm.get('name')?.invalid }" />
            <div *ngIf="editForm.get('name')?.touched && editForm.get('name')?.invalid" class="text-danger text-sm">Name is required.</div>
          </td>
          <td>
            <app-searchable-dropdown
              [placeholder]="'Technique'"
              [fetchDataFn]="getTechniques"
              [smallInput]="true"
              (itemSelected)="editForm.patchValue({ analysisTechniqueID: $event?.id || null })"
              [selectedItem]="editForm.get('analysisTechniqueID')?.value"
            ></app-searchable-dropdown>
          </td>
          <td><input type="text" class="form-control form-control-sm" formControlName="pricingRuleType" placeholder="e.g. FLAT" /></td>
          <td><input type="text" class="form-control form-control-sm" formControlName="invoiceCaption" /></td>
          <td>
            <div class="d-flex gap-1">
              <button type="button" class="btn btn-sm btn-success py-0 px-1" (click)="saveEdit(st)" title="Save"><i class="bi bi-check-lg"></i></button>
              <button type="button" class="btn btn-sm btn-secondary py-0 px-1" (click)="cancelEdit()" title="Cancel"><i class="bi bi-x-lg"></i></button>
            </div>
          </td>
        </tr>
        <tr *ngIf="editRowId !== st.id">
          <td class="fw-medium">{{ st.name }}</td>
          <td>{{ st.analysisTechnique?.name || '-' }}</td>
          <td><code class="small">{{ st.pricingRuleType || '-' }}</code></td>
          <td class="small text-muted">{{ st.invoiceCaption || '-' }}</td>
          <td *ngIf="!isViewMode">
            <div class="d-flex gap-1">
              <button type="button" class="btn btn-sm btn-outline-primary py-0 px-1" (click)="startEdit(st)" title="Edit"><i class="bi bi-pencil"></i></button>
              <button type="button" class="btn btn-sm btn-outline-danger py-0 px-1" (click)="deleteSubType(st)" title="Delete"><i class="bi bi-trash"></i></button>
            </div>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
