<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg border-0">
    <!-- Premium Header -->
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center">
        <i class="bi bi-calendar2-check-fill fs-4 me-2"></i>
        <header class="text-md fw-medium">{{ formTitle }}</header>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-light btn-sm px-3" (click)="onCancel()">
          <i class="bi bi-arrow-left me-1"></i>
          Back to List
        </button>
      </div>
    </div>

    <div class="card-body p-4">
      <form [formGroup]="attendanceForm" (ngSubmit)="onSubmit()" [class.ra-form-disabled]="attendanceForm.disabled">
        <!-- Section I: Header Information -->
        <div class="accordion-section mb-4">
          <div
            class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top"
            (click)="toggleSection('header')"
            style="cursor: pointer"
          >
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">I. Document Control Information</span>
          </div>
          <div *ngIf="openSections['header']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">
                  Form Number
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" formControlName="formatNo" list="formNumbers" placeholder="e.g. F-9" />
                <datalist id="formNumbers">
                  <option *ngFor="let form of formNumbers" [value]="form"></option>
                </datalist>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">
                  Issue No
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control bg-light" formControlName="issueNo" readonly placeholder="Auto" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">
                  Rev No
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control bg-light" formControlName="revNo" readonly placeholder="Auto" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold text-dark small">
                  Date
                  <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control bg-light" formControlName="date" readonly />
              </div>
            </div>
          </div>
        </div>

        <!-- Section II: Training Details -->
        <div class="accordion-section mb-4">
          <div
            class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top"
            (click)="toggleSection('details')"
            style="cursor: pointer"
          >
            <i class="bi" [ngClass]="openSections['details'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">II. Training Program Identification</span>
          </div>
          <div *ngIf="openSections['details']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label fw-semibold text-dark small">
                  Training Program Title
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control shadow-sm"
                  formControlName="trainingProgramTitle"
                  placeholder="e.g. Requirement of National / International Standards"
                />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">
                  Training Venue
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control shadow-sm" formControlName="trainingVenue" placeholder="e.g. DMSPL" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">
                  Faculty Name
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control shadow-sm" formControlName="facultyName" placeholder="Enter Faculty Name" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">
                  Date & Time
                  <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control shadow-sm" formControlName="dateTime" placeholder="e.g. 03/09/25 & 4:00 pm" />
              </div>
            </div>
          </div>
        </div>

        <!-- Section III: Participants -->
        <div class="accordion-section mb-4">
          <div
            class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top"
            (click)="toggleSection('participants')"
            style="cursor: pointer"
          >
            <i class="bi" [ngClass]="openSections['participants'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">III. Attendance & Participant Feedback</span>
          </div>
          <div *ngIf="openSections['participants']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="table-responsive">
              <table class="table table-bordered align-middle sm-table">
                <thead class="table-light text-center">
                  <tr>
                    <th width="80">Sl. No.</th>
                    <th>
                      Name of Participant
                      <span class="text-danger">*</span>
                    </th>
                    <th width="300">
                      Participant's Feedback
                      <span class="text-danger">*</span>
                    </th>
                    <th width="80" *ngIf="!isViewMode">Action</th>
                  </tr>
                </thead>
                <tbody formArrayName="participants">
                  <tr *ngFor="let p of participants.controls; let i = index" [formGroupName]="i">
                    <td class="text-center fw-bold text-secondary">{{ p.get("slNo")?.value }}</td>
                    <td>
                      <input type="text" class="form-control form-control-sm" formControlName="participantName" placeholder="Enter name" />
                    </td>
                    <td>
                      <select class="form-select form-select-sm" formControlName="feedback">
                        <option *ngFor="let f of feedbacks" [value]="f">{{ f }}</option>
                      </select>
                    </td>
                    <td class="text-center" *ngIf="!isViewMode">
                      <button
                        type="button"
                        class="btn btn-sm btn-remove border-0"
                        (click)="removeParticipant(i)"
                        [disabled]="participants.length === 1"
                      >
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div *ngIf="!isViewMode" class="mt-3 text-end">
              <button type="button" class="btn btn-add btn-sm px-3 shadow-sm" (click)="addParticipant()">
                <i class="bi bi-plus-lg me-1"></i>
                Add Participant Line
              </button>
            </div>
          </div>
        </div>

        <!-- Section IV: Remarks & Approval -->
        <div class="accordion-section mb-4">
          <div
            class="section-header d-flex align-items-center py-2 px-3 bg-light rounded-top"
            (click)="toggleSection('approval')"
            style="cursor: pointer"
          >
            <i class="bi" [ngClass]="openSections['approval'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2 ">IV. Remarks & Signatories</span>
          </div>
          <div *ngIf="openSections['approval']" class="section-body p-3 border border-top-0 rounded-bottom">
            <div class="row g-3">
              <div class="col-12 d-flex flex-column mb-3">
                <label class="form-label fw-semibold text-dark small">General Remarks / Session Highlights</label>
                <quill-editor
                  formControlName="remarks"
                  [modules]="quillModules"
                  placeholder="Enter session remarks..."
                  [readOnly]="isViewMode"
                ></quill-editor>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">Prepared By (GM)</label>
                <input type="text" class="form-control shadow-sm" formControlName="preparedBy" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">Issued By (QM)</label>
                <input type="text" class="form-control shadow-sm" formControlName="issuedBy" />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold text-dark small">Reviewed & Approved By (MD)</label>
                <input type="text" class="form-control shadow-sm" formControlName="reviewedApprovedBy" />
              </div>
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-light px-4 fw-semibold border shadow-sm" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-save px-4 fw-semibold shadow-sm" [disabled]="attendanceForm.invalid">
            <i class="bi bi-check2-circle me-1"></i>
            {{ isEditMode ? "Update" : "Save" }} Record
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
