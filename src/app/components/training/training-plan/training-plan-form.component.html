<div class="container-fluid mt-4 d-flex flex-column align-items-center">
  <div class="card w-100 shadow-lg">
    <div class="card-header card-form-header text-white d-flex justify-content-between align-items-center">
      <label class="text-md fw-medium ms-3">{{ formTitle }}</label>
      <button type="button" class="btn btn-outline-light btn-sm me-3" (click)="onCancel()">
        <i class="bi bi-arrow-left"></i> Back to List
      </button>
    </div>

    <div class="card-body">
      <form [formGroup]="planForm" (ngSubmit)="onSubmit()">

        <!-- Section I: Header Information -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('header')">
            <i class="bi" [ngClass]="openSections['header'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">I. Header Information</span>
          </div>
          <div *ngIf="openSections['header']" class="section-body">
            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label">Form Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="formatNo" list="formNumbers"
                  placeholder="e.g. F-8" [ngClass]="{'is-invalid': isFieldInvalid('formatNo')}" readonly>
                <datalist id="formNumbers">
                  <option *ngFor="let form of formNumbers" [value]="form"></option>
                </datalist>
                <app-field-error [control]="planForm.get('formatNo')" label="Form Number" [submitted]="submitted" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Issue No <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" formControlName="issueNo" readonly placeholder="Auto">
              </div>
              <div class="col-md-3">
                <label class="form-label">Rev No <span class="text-danger">*</span></label>
                <input type="text" class="form-control bg-light" formControlName="revNo" readonly placeholder="Auto">
              </div>
              <div class="col-md-3">
                <label class="form-label">Date <span class="text-danger">*</span></label>
                <input type="date" class="form-control bg-light" formControlName="date" readonly>
              </div>
              <div class="col-md-3">
                <label class="form-label">Document No <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="documentNo" placeholder="Enter Document No"
                  [ngClass]="{'is-invalid': isFieldInvalid('documentNo')}" readonly>
                <app-field-error [control]="planForm.get('documentNo')" label="Document No" [submitted]="submitted" />
              </div>
            
            </div>
          </div>
        </div>

        <!-- Section II: Training Courses -->
        <div class="accordion-section mb-3">
          <div class="section-header" (click)="toggleSection('courses')">
            <i class="bi" [ngClass]="openSections['courses'] ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
            <span class="fw-bold ms-2">II. Training Plans</span>
          </div>
          <div *ngIf="openSections['courses']" class="section-body p-3 border border-top-0 rounded-bottom">
          
            <div class="row g-2">
            
              <div class="col-md-6">
                <label class="form-label small fw-bold">Plan Description <span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="trainingTopic"
                  placeholder="Requirement of National/International standards"
                  [ngClass]="{'is-invalid': isFieldInvalid('trainingTopic')}">
                <app-field-error [control]="planForm.get('trainingTopic')" label="Training Description"
                  [submitted]="submitted" />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Planning Year <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="planningYear"
                  [ngClass]="{'is-invalid': isFieldInvalid('planningYear')}">
                  <option [ngValue]="null">Select Year</option>
                  <option *ngFor="let y of yearOptions" [ngValue]="y">{{ y }}</option>
                </select>
                <app-field-error [control]="planForm.get('planningYear')" label="Planning Year"
                  [submitted]="submitted" />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Month</label>
                <select class="form-select " formControlName="planMonth">
                  <option [ngValue]="null" disabled>Select Month</option>
                  <option *ngFor="let m of months" [ngValue]="m">{{ m }}</option>
                </select>
              </div>
               <div class="col-md-4">
                <label class="form-label small fw-bold">To be attended by (Audience)</label>
                <input type="text" class="form-control" formControlName="targetAudience"
                  placeholder="All staff / Specific Dept">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Agency</label>
                <select class="form-select" formControlName="agency">
                  <option *ngFor="let a of agencies" [value]="a">{{ a }}</option>
                </select>
              </div>
             
              <div class="col-md-3">
                <label class="form-label small fw-bold">Provider/Agency</label>
                <input type="text" class="form-control " formControlName="provider"
                  placeholder="Internal / External Agency Name">
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold">Days <span class="text-danger">*</span></label>
                <input type="number" class="form-control " formControlName="duration"
                  [ngClass]="{'is-invalid': isFieldInvalid('duration')}">
                <app-field-error [control]="planForm.get('duration')" label="Days" [submitted]="submitted" />
              </div>
              <div class="col-md-5">
                <label class="form-label small fw-bold">Remarks</label>
                <input type="text" class="form-control" formControlName="completionRemarks"
                  placeholder="Notes or additional info">
              </div>
            

              <div class="col-md-3">
                <label class="form-label small fw-bold">Approval Status <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="approvalStatus">
                  <option *ngFor="let status of approvalStatuses">{{ status }}</option>
                </select>
              </div>
            </div>
          </div>

        </div>

        <app-nabl-signature-section [parentForm]="planForm"></app-nabl-signature-section>

        <!-- Footer Actions -->
        <div *ngIf="!isViewMode" class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
          <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-save">
            <i class="bi bi-save me-1"></i> {{ isEditMode ? 'Update' : 'Save' }} Plan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
