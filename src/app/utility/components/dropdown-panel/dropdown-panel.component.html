<ul
  #listRef
  class="list-group dropdown-panel"
  style="max-height: 220px; overflow-y: auto;"
  (scroll)="onScrollEvent($event)"
>
  <ng-container *ngFor="let item of items; let i = index; trackBy: trackById">
    <!-- Non-selectable Group Header (Level 0: Master Test Group or general header) -->
    <li
      *ngIf="item.isHeader && (item.level === 0 || !item.level)"
      class="list-group-item bg-light text-secondary fw-bold small py-1 px-2 text-uppercase position-sticky top-0 z-1 border-bottom border-top dropdown-group-header-0"
      style="font-size: 0.72rem; letter-spacing: 0.5px; cursor: default; user-select: none;"
    >
      <i class="bi bi-folder2-open me-1 text-danger"></i> {{ item.name }}
    </li>

    <!-- Non-selectable Intermediate SubGroup Header (Level 1: e.g. Chemical SubGroup) -->
    <li
      *ngIf="item.isHeader && item.level === 1"
      class="list-group-item bg-light-subtle text-dark fw-semibold small py-1 ps-3 pe-2 border-bottom dropdown-group-header-1"
      style="font-size: 0.74rem; letter-spacing: 0.2px; cursor: default; user-select: none;"
    >
      <i class="bi bi-folder me-1 text-secondary"></i> {{ item.name }}
    </li>

    <!-- Selectable Option -->
    <li
      *ngIf="!item.isHeader && item.selectable !== false"
      class="list-group-item cursor-pointer py-1 dropdown-selectable-item"
      [class.ps-3]="item.level === 1 || (item.isChild && !item.level)"
      [class.ps-4]="item.level === 2"
      [class.active]="i === highlightedIndex"
      (click)="onSelect(item, i)"
      (mouseenter)="onHover(item, i)"
    >
      <div class="d-flex align-items-center justify-content-between">
        <span class="d-flex align-items-center">
          <i *ngIf="item.level > 0 || item.isChild" class="bi bi-arrow-return-right text-muted me-1" style="font-size: 0.7rem;"></i>
          <span>{{ item.name }}</span>
        </span>
        <span *ngIf="item.isBase" class="badge bg-secondary-subtle text-secondary border text-xs ms-1">Base</span>
      </div>
    </li>
  </ng-container>

  <!-- Loading -->
  <li *ngIf="loading" class="list-group-item text-center py-2">
    <span class="spinner-border spinner-border-sm text-danger me-1" role="status"></span>
    <span class="text-muted small">Loading...</span>
  </li>

  <!-- Empty -->
  <li
    *ngIf="items.length === 0 && !loading"
    class="list-group-item text-muted text-center"
  >
    <span class="fw-lighter fst-italic fs-6">No Record</span>
  </li>
</ul>
