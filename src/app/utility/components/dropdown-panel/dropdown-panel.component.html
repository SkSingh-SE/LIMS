<ul
  #listRef
  class="list-group dropdown-panel"
  style="max-height: 220px; overflow-y: auto;"
  (scroll)="onScrollEvent($event)"
>
  <ng-container *ngFor="let item of items; let i = index; trackBy: trackById">
    <!-- Non-selectable Group Header -->
    <li
      *ngIf="item.isHeader"
      class="list-group-item bg-light text-secondary fw-bold small py-1 px-2 text-uppercase position-sticky top-0 z-1 border-bottom border-top"
      style="font-size: 0.72rem; letter-spacing: 0.5px;"
    >
      <i class="bi bi-folder2-open me-1 text-danger"></i> {{ item.name }}
    </li>

    <!-- Selectable Unit Option -->
    <li
      *ngIf="!item.isHeader"
      class="list-group-item cursor-pointer py-1"
      [class.ps-4]="item.isChild"
      [class.active]="i === highlightedIndex"
      (click)="onSelect(item, i)"
      (mouseenter)="highlightedIndex = i"
    >
      <div class="d-flex align-items-center justify-content-between">
        <span>{{ item.name }}</span>
        <span *ngIf="item.isBase" class="badge bg-secondary-subtle text-secondary border text-xs ms-1">Base</span>
      </div>
    </li>
  </ng-container>

  <!-- Loading -->
  <li *ngIf="loading" class="list-group-item text-center py-2">
    <span class="spinner-border spinner-border-sm text-danger me-1" role="status"></span>
    <span class="text-muted small">Loading...</span>
  </li>

  <!-- Empty -->
  <li
    *ngIf="items.length === 0 && !loading"
    class="list-group-item text-muted text-center"
  >
    <span class="fw-lighter fst-italic fs-6">No Record</span>
  </li>
</ul>
