<!-- Floating Action Button (Draggable) -->
<button class="floating-symbol-btn" [class.active]="isOpen" [class.dragging]="isDragging"
  title="Symbol Picker (Ctrl+Shift+S)"
  [style.bottom.px]="btnPosition.bottom" [style.right.px]="btnPosition.right"
  (mousedown)="onDragStart($event)" (touchstart)="onDragStart($event)"
  (click)="toggle()">
  <span class="symbol-icon">&#937;</span>
</button>

<!-- Toast notification -->
<div class="floating-toast" *ngIf="toastMessage"
  [style.bottom.px]="btnPosition.bottom + 60" [style.right.px]="btnPosition.right">
  <i class="bi bi-clipboard-check"></i> {{ toastMessage }}
</div>

<!-- Popup Panel -->
<div class="floating-symbol-panel shadow-lg" *ngIf="isOpen" (click)="$event.stopPropagation()"
  [style.bottom.px]="btnPosition.bottom + 60" [style.right.px]="btnPosition.right">
  <!-- Header -->
  <div class="panel-header">
    <span class="fw-semibold">
      <i class="bi bi-fonts"></i> Symbol Picker
    </span>
    <div class="d-flex align-items-center gap-2">
      <small class="header-shortcut">Ctrl+Shift+S</small>
      <button type="button" class="btn-close btn-close-white btn-close-sm" (click)="isOpen = false"></button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="panel-tabs">
    <button type="button" class="tab-btn" [class.active]="activeTab === 'all'"
      (click)="switchTab('all')">All</button>
    <button type="button" class="tab-btn" [class.active]="activeTab === 'favorites'"
      (click)="switchTab('favorites')">
      <i class="bi bi-star-fill text-warning"></i> Favorites
    </button>
    <button type="button" class="tab-btn" [class.active]="activeTab === 'recent'"
      (click)="switchTab('recent')">
      <i class="bi bi-clock-history"></i> Recent
    </button>
  </div>

  <!-- Search -->
  <div class="panel-search" *ngIf="activeTab === 'all'">
    <input type="text" class="form-control form-control-sm" placeholder="Search... (degree, alpha, sigma, arrow)"
      [(ngModel)]="searchText" (click)="$event.stopPropagation()" />
  </div>

  <!-- Symbol Body -->
  <div class="panel-body">
    <!-- All Symbols Tab -->
    <ng-container *ngIf="activeTab === 'all'">
      <div *ngFor="let group of filteredGroups" class="symbol-group">
        <div class="group-label">{{ group.label }}</div>
        <div class="symbols-grid">
          <div *ngFor="let sym of group.symbols" class="sym-wrapper">
            <button type="button" class="sym-btn" [title]="sym.name"
              [class.is-favorite]="isFavorite(sym.char)"
              (click)="selectSymbol(sym.char, sym.name)">
              {{ sym.char }}
            </button>
            <button type="button" class="fav-toggle" [title]="isFavorite(sym.char) ? 'Remove from favorites' : 'Add to favorites'"
              (click)="toggleFavorite($event, sym.char, sym.name)">
              <i class="bi" [class.bi-star-fill]="isFavorite(sym.char)" [class.bi-star]="!isFavorite(sym.char)"></i>
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="filteredGroups.length === 0" class="text-center text-muted py-3">
        <small>No symbols found for "{{ searchText }}"</small>
      </div>
    </ng-container>

    <!-- Favorites Tab -->
    <ng-container *ngIf="activeTab === 'favorites'">
      <div *ngIf="favoriteSymbols.length > 0" class="symbol-group">
        <div class="group-label">Your Favorites</div>
        <div class="symbols-grid">
          <div *ngFor="let sym of favoriteSymbols" class="sym-wrapper">
            <button type="button" class="sym-btn is-favorite" [title]="sym.name"
              (click)="selectSymbol(sym.char, sym.name)">
              {{ sym.char }}
            </button>
            <button type="button" class="fav-toggle active" title="Remove from favorites"
              (click)="toggleFavorite($event, sym.char, sym.name)">
              <i class="bi bi-star-fill"></i>
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="favoriteSymbols.length === 0" class="text-center text-muted py-4">
        <i class="bi bi-star fs-3 d-block mb-2"></i>
        <small>No favorites yet</small><br />
        <small class="text-secondary">Click the star on any symbol to add it here</small>
      </div>
    </ng-container>

    <!-- Recent Tab -->
    <ng-container *ngIf="activeTab === 'recent'">
      <div *ngIf="recentSymbols.length > 0" class="symbol-group">
        <div class="group-label">Recently Used</div>
        <div class="symbols-grid">
          <div *ngFor="let sym of recentSymbols" class="sym-wrapper">
            <button type="button" class="sym-btn" [title]="sym.name"
              [class.is-favorite]="isFavorite(sym.char)"
              (click)="selectSymbol(sym.char, sym.name)">
              {{ sym.char }}
            </button>
            <button type="button" class="fav-toggle" [title]="isFavorite(sym.char) ? 'Remove from favorites' : 'Add to favorites'"
              (click)="toggleFavorite($event, sym.char, sym.name)">
              <i class="bi" [class.bi-star-fill]="isFavorite(sym.char)" [class.bi-star]="!isFavorite(sym.char)"></i>
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="recentSymbols.length === 0" class="text-center text-muted py-4">
        <i class="bi bi-clock-history fs-3 d-block mb-2"></i>
        <small>No recently used symbols</small>
      </div>
    </ng-container>
  </div>

  <!-- Footer hint -->
  <div class="panel-footer">
    <small>
      <i class="bi bi-info-circle"></i>
      Click an input first, then select symbol | Drag the <b>&#937;</b> button to move
    </small>
  </div>
</div>
