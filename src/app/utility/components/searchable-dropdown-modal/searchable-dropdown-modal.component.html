<div class="position-relative w-100">
  <label *ngIf="!hideLabel" [for]="randomId" class="form-label">
    {{ labelName }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
  <div class="input-group">
    <input
      type="text"
      [id]="randomId"
      class="form-control"
      name="searchInput"
      [placeholder]="placeholder"
      [(ngModel)]="selectedLabel"
      [required]="required"
      #inputRef="ngModel"
      [ngClass]="{ 'is-invalid': required && inputRef.invalid && inputRef.touched }"
      [disabled]="isDisabled"
      (input)="handleInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="handleKeydown($event)"
      autocomplete="off"
    />

    <!-- Compact display for multi-select with hover tooltip -->
    <div *ngIf="isMultiSelect" class="multi-select-display" [class.has-items]="selectedItems.length > 0" (mouseenter)="updateTooltipPosition()" (click)="openDropdown()">
      <span class="compact-label">{{ getCompactLabel() || placeholder }}</span>
      <!-- Hover tooltip showing all selected names (fixed position to escape overflow) -->
      <div *ngIf="selectedItems.length > 1" class="hover-tooltip" [ngStyle]="tooltipStyle">
        <div *ngFor="let item of selectedItems" class="tooltip-item">{{ item.name }}</div>
      </div>
    </div>

    <!-- Dropdown Icon -->
    <span class="input-group-text dropdown-toggle-icon" role="button" (click)="showDropdown ? showDropdown = false : openDropdown()" *ngIf="!isDisabled">
      <i class="bi bi-chevron-down"></i>
    </span>
  </div>
  <!-- Validation feedback -->
  <div *ngIf="required && inputRef.invalid && inputRef.touched" class="invalid-feedback">{{ labelName }} is required.</div>

  <!-- Dropdown list -->
  <ul
    *ngIf="showDropdown && dropdownData.length > 0"
    class="dropdown-panel"
    [ngStyle]="dropdownStyle"
    (scroll)="onScroll($event)"
  >
    <li
      class="dropdown-item"
      *ngFor="let item of dropdownData; let i = index"
      [id]="randomId + '-item-' + i"
      [class.active]="!isMultiSelect && highlightedIndex === i"
      [class.multi-selected]="isMultiSelect && isSelected(item)"
      (mouseenter)="highlightedIndex = i"
      (mousedown)="isMultiSelect ? toggleItem(item) : selectItem(item)"
    >
      <i *ngIf="isMultiSelect" class="bi me-2" [ngClass]="isSelected(item) ? 'bi-check-square-fill check-selected' : 'bi-square check-unselected'"></i>
      {{ item.name }}
    </li>

    <li *ngIf="loading" class="dropdown-item loading-item">Loading...</li>
  </ul>
</div>
