<div class="position-relative w-100">
  <label *ngIf="!hideLabel" [for]="randomId" class="form-label">
    {{ labelName }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
  <div class="input-group" [class.input-group-sm]="size === 'sm'">
    <input
      type="text"
      [id]="randomId"
      [class]="size === 'sm' ? 'form-control form-control-sm' : 'form-control'"
      name="searchInput"
      [placeholder]="placeholder"
      [(ngModel)]="selectedLabel"
      [required]="required"
      #inputRef="ngModel"
      [ngClass]="{ 'is-invalid': required && inputRef.invalid && inputRef.touched }"
      [disabled]="isDisabled"
      (input)="handleInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="handleKeydown($event)"
      autocomplete="off"
    />

    <!-- Compact display for multi-select with hover tooltip -->
    <div *ngIf="isMultiSelect" class="multi-select-display" [class.has-items]="selectedItems.length > 0" (mouseenter)="updateTooltipPosition()" (click)="openDropdown()">
      <span class="compact-label">{{ getCompactLabel() || placeholder }}</span>
      <!-- Hover tooltip showing all selected names (fixed position to escape overflow) -->
      <div *ngIf="selectedItems.length > 1" class="hover-tooltip" [ngStyle]="tooltipStyle">
        <div *ngFor="let item of selectedItems; trackBy: trackById" class="tooltip-item">{{ item.name }}</div>
      </div>
    </div>

    <!-- Clear Icon — works for both single and multi-select -->
    <span
      class="input-group-text clear-icon"
      role="button"
      (mousedown)="clearSelection($event)"
      *ngIf="!isDisabled && (selectedLabel || selectedItems.length > 0)"
      title="Clear"
    >
      <i class="bi bi-x-lg"></i>
    </span>
    <!-- Dropdown Icon -->
    <span class="input-group-text dropdown-toggle-icon" role="button" (mousedown)="showDropdown ? showDropdown = false : openDropdown()" *ngIf="!isDisabled">
      <i class="bi bi-chevron-down"></i>
    </span>
  </div>
  <!-- Validation feedback -->
  <div *ngIf="required && inputRef.invalid && inputRef.touched" class="invalid-feedback">{{ labelName }} is required.</div>

  <!-- Dropdown list -->
  <ul
    *ngIf="showDropdown"
    class="dropdown-panel"
    [ngStyle]="dropdownStyle"
    (scroll)="onScroll($event)"
  >
    <li
      class="dropdown-item"
      *ngFor="let item of dropdownData; let i = index; trackBy: trackById"
      [id]="randomId + '-item-' + i"
      [class.active]="!isMultiSelect && highlightedIndex === i"
      [class.multi-selected]="isMultiSelect && isSelected(item)"
      (mouseenter)="highlightedIndex = i"
      (mousedown)="isMultiSelect ? toggleItem(item) : selectItem(item)"
    >
      <i *ngIf="isMultiSelect" class="bi me-2" [ngClass]="isSelected(item) ? 'bi-check-square-fill check-selected' : 'bi-square check-unselected'"></i>
      {{ item.name }}
    </li>

    <!-- Loading -->
    <li *ngIf="loading" class="dropdown-item loading-item">
      <span class="spinner-border spinner-border-sm text-danger me-1" role="status"></span>
      <span class="text-muted small">Loading...</span>
    </li>

    <!-- Empty state -->
    <li *ngIf="dropdownData.length === 0 && !loading" class="dropdown-item text-muted text-center">
      <span class="fw-lighter fst-italic fs-6">No Record</span>
    </li>
  </ul>
</div>
