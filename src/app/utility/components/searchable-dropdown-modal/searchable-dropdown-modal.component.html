<div class="position-relative w-100">
  <label *ngIf="!hideLabel" [for]="randomId" class="form-label">
    {{ labelName }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
  <div class="input-group">
    <input
      type="text"
      [id]="randomId"
      class="form-control"
      name="searchInput"
      [placeholder]="placeholder"
      [(ngModel)]="selectedLabel"
      [required]="required"
      #inputRef="ngModel"
      [ngClass]="{ 'is-invalid': required && inputRef.invalid && inputRef.touched }"
      [disabled]="isDisabled"
      (input)="handleInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="handleKeydown($event)"
      autocomplete="off"
    />

    <!-- Fake input for displaying selected labels in multi-select -->
    <input
      *ngIf="isMultiSelect"
      type="text"
      class="form-control position-absolute bg-white"
      [value]="getSelectedLabels()"
      [placeholder]="placeholder"
      [disabled]="true"
      style="top: 0; left: 0; pointer-events: none"
    />

    <!-- Dropdown Icon -->
    <span class="input-group-text dropdown-toggle-icon" role="button" (click)="showDropdown = !showDropdown" *ngIf="!isDisabled">
      <i class="bi bi-chevron-down"></i>
    </span>
  </div>
  <!-- Validation feedback -->
  <div *ngIf="required && inputRef.invalid && inputRef.touched" class="invalid-feedback">This field is required.</div>

  <ul
    *ngIf="showDropdown && dropdownData.length > 0"
    class="list-group position-absolute w-100 z-3 mt-1"
    style="
      max-height: 200px;
      overflow-y: auto;
      top: 100%;
      left: 0;
      background-color: white;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      z-index: 1050;
    "
    (scroll)="onScroll($event)"
  >
    <li
      class="list-group-item cursor-pointer"
      *ngFor="let item of dropdownData; let i = index"
      [id]="randomId + '-item-' + i"
      [class.active]="highlightedIndex === i"
      (mouseenter)="highlightedIndex = i"
      (mousedown)="isMultiSelect ? toggleItem(item) : selectItem(item)"
    >
      {{ item.name }}
    </li>

    <li *ngIf="loading" class="list-group-item">Loading...</li>
  </ul>
</div>
