<div class="position-relative w-100">
  <label *ngIf="!hideLabel" [for]="randomId" class="form-label" [ngClass]="{'form-label-sm': smallInput}">
    {{ labelName }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
  <div class="input-group" [class.input-group-sm]="smallInput">
    <input
      type="text"
      [id]="randomId"
      [class]="smallInput ? 'form-control form-control-sm' : 'form-control'"
      name="searchInput"
      [placeholder]="placeholder"
      [(ngModel)]="selectedLabel"
      [required]="required"
      #inputRef="ngModel"
      [ngClass]="{ 'is-invalid': required && inputRef.invalid && inputRef.touched }"
      [disabled]="isDisabled"
      (input)="handleInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (keydown)="handleKeydown($event)"
      autocomplete="off"
    />

    <!-- Compact display for multi-select with hover tooltip -->
    <div *ngIf="isMultiSelect" class="multi-select-display" [class.has-items]="selectedItems.length > 0" (mouseenter)="updateTooltipPosition()" (click)="openDropdown()">
      <span class="compact-label">{{ getCompactLabel() || placeholder }}</span>
      <!-- Hover tooltip showing all selected names (fixed position to escape overflow) -->
      <div *ngIf="selectedItems.length > 1" class="hover-tooltip" [ngStyle]="tooltipStyle">
        <div *ngFor="let item of selectedItems; trackBy: trackById" class="tooltip-item">{{ item.name }}</div>
      </div>
    </div>

    <!-- Clear Icon — works for both single and multi-select -->
    <span
      class="input-group-text clear-icon"
      role="button"
      (mousedown)="clearSelection($event)"
      *ngIf="!isDisabled && (selectedLabel || selectedItems.length > 0)"
      title="Clear"
    >
      <i class="bi bi-x-lg"></i>
    </span>
    <!-- Dropdown Icon -->
    <span class="input-group-text dropdown-toggle-icon" role="button" (mousedown)="toggleDropdown($event)" *ngIf="!isDisabled">
      <i class="bi bi-chevron-down"></i>
    </span>
  </div>
  <!-- Validation feedback -->
  <div *ngIf="required && inputRef.invalid && inputRef.touched" class="invalid-feedback">{{ labelName }} is required.</div>

  <!-- Dropdown list panel with Tree Hierarchy Support -->
  <ul
    *ngIf="showDropdown"
    class="dropdown-panel"
    [ngStyle]="dropdownStyle"
    (scroll)="onScroll($event)"
  >
    <ng-container *ngFor="let item of dropdownData; let i = index; trackBy: trackById">
      <!-- Non-selectable Group Header (Level 0: Department or Organization or General header) -->
      <li
        *ngIf="item.isHeader && (item.level === 0 || !item.level)"
        class="dropdown-group-header-0"
      >
        <i class="bi bi-folder2-open me-1 text-danger"></i> {{ item.name }}
      </li>

      <!-- Non-selectable Intermediate SubGroup Header (Level 1: e.g. SubGroup or Test Method Standard) -->
      <li
        *ngIf="item.isHeader && item.level === 1"
        class="dropdown-group-header-1"
      >
        <i class="bi bi-folder me-1 text-secondary"></i> {{ item.name }}
      </li>

      <!-- Selectable Option -->
      <li
        *ngIf="!item.isHeader && item.selectable !== false"
        class="dropdown-item dropdown-selectable-item"
        [id]="randomId + '-item-' + i"
        [class.ps-3]="item.level === 1 || (item.isChild && !item.level)"
        [class.ps-4]="item.level === 2"
        [class.active]="!isMultiSelect && highlightedIndex === i"
        [class.multi-selected]="isMultiSelect && isSelected(item)"
        (mouseenter)="highlightedIndex = i"
        (mousedown)="isMultiSelect ? toggleItem(item) : selectItem(item)"
      >
        <div class="d-flex align-items-center justify-content-between w-100">
          <span class="d-flex align-items-center">
            <i *ngIf="isMultiSelect" class="bi me-2" [ngClass]="isSelected(item) ? 'bi-check-square-fill check-selected' : 'bi-square check-unselected'"></i>
            <i *ngIf="!isMultiSelect && (item.level > 0 || item.isChild)" class="bi bi-arrow-return-right text-muted me-1 tree-arrow"></i>
            <span>{{ item.name }}</span>
          </span>
          <span *ngIf="item.isBase" class="badge bg-secondary-subtle text-secondary border text-xs ms-1">Base</span>
        </div>
      </li>
    </ng-container>

    <!-- Loading -->
    <li *ngIf="loading" class="dropdown-item loading-item">
      <span class="spinner-border spinner-border-sm text-danger me-1" role="status"></span>
      <span class="text-muted small">Loading...</span>
    </li>

    <!-- Empty state -->
    <li *ngIf="dropdownData.length === 0 && !loading" class="dropdown-item text-muted text-center empty-state">
      <span class="fw-lighter fst-italic fs-6">No Record</span>
    </li>
  </ul>
</div>
